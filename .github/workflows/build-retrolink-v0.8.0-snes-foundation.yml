      - name: Static SNES validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          core = Path("app/src/main/java/cl/retrolink/app/CoreRegistry.java").read_text()
          repo = Path("app/src/main/java/cl/retrolink/app/SnesRomRepository.java").read_text()
          library = Path("app/src/main/java/cl/retrolink/app/SnesLibraryActivity.java").read_text()
          room = Path("app/src/main/java/cl/retrolink/app/SnesRoomActivity.java").read_text()
          controller = Path("app/src/main/java/cl/retrolink/app/SnesControllerActivity.java").read_text()
          game = Path("app/src/main/java/cl/retrolink/app/SnesGameActivity.java").read_text()
          bind = Path("app/src/main/java/cl/retrolink/app/SnesControlBinder.java").read_text()
          gp = Path("app/src/main/java/cl/retrolink/app/SnesGamepadMapper.java").read_text()
          host_ble = Path("app/src/main/java/cl/retrolink/app/ble/HostBleManager.java").read_text()
          software = Path("app/src/main/java/cl/retrolink/app/SoftwareCoreView.java").read_text()
          native = Path("app/src/main/cpp/retrolink_native.cpp").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          build = Path("app/build.gradle").read_text()

          assert '"snes.snes9x"' in core
          assert '"libretro_snes9x.so"' in core
          assert '"sfc|smc"' in core
          assert 'n.endsWith(".sfc") || n.endsWith(".smc")' in repo

          assert 'Snes9x' in library
          assert 'SnesRoomActivity.class' in library
          assert 'setSessionType("SNES")' in room
          assert 'setMaxPlayerNumber(2)' in room
          assert 'SnesControllerActivity.class' in room
          assert 'FrameStreamServer' in room
          assert 'P2 no necesita ROM' in room

          assert 'FrameStreamClient' in controller
          assert '"SNES".equals(sessionType)' in controller
          assert 'video.start(hostIp, 2, false)' in controller
          assert 'SnesControlBinder' in controller
          assert 'SnesControlBinder' in game
          assert 'CoreRegistry.SNES' in game

          assert 'R.id.btnX' in bind and 'R.id.btnY' in bind
          assert 'BleProtocol.C_LEFT' in bind
          assert 'BleProtocol.C_UP' in bind
          assert 'KEYCODE_BUTTON_X' in gp and 'KEYCODE_BUTTON_Y' in gp

          assert 'else if ("SNES".equals(value)) this.sessionType = "SNES";' in host_ble
          assert 'core == CoreRegistry.SNES && FrameStreamServer.hasRemoteClients()' in software
          assert 'RETRO_DEVICE_ID_JOYPAD_X' in native
          assert 'in.mask & C_UP' in native
          assert 'in.mask & C_LEFT' in native

          for cls in ("SnesControllerActivity","SnesGameActivity","SnesRoomActivity","SnesLibraryActivity"):
              assert f'android:name=".{cls}"' in manifest

          assert 'versionCode 40' in build
          assert 'versionName "0.8.0-rc1"' in build

          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)
          ET.parse("app/src/main/AndroidManifest.xml")

          ids=set()
          for p in Path("app/src/main/res").rglob("*.xml"):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors="ignore")))

          new_sources = [
              "SnesLibraryActivity.java","SnesRoomActivity.java","SnesControllerActivity.java",
              "SnesGameActivity.java","SnesControlBinder.java"
          ]
          refs=set()
          for name in new_sources:
              text=Path("app/src/main/java/cl/retrolink/app/"+name).read_text(errors="ignore")
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', text))
          missing=sorted(refs-ids)
          assert not missing, f"Missing SNES R.id: {missing}"

          print("v0.8.0 SNES source validation PASS")
          PY

      - name: Commit v0.8.0 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v0.8.0 source already committed."
          else
            git commit -m "feat(v0.8.0): add Snes9x library and RetroLink 2P multiplayer"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Build pinned N64 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -s libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build pinned Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gambattecore
          git init gambattecore
          cd gambattecore
          git remote add origin https://github.com/libretro/gambatte-libretro.git
          git fetch --depth 1 origin "${GAMBATTE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GAMBATTE_SHA}"
          grep -q 'HAVE_NETWORK := 1' libgambatte/libretro/jni/Android.mk
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libgambatte/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libgambatte/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_gambatte.so

      - name: Install Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          cp gambattecore/libgambatte/libretro/jni/libs/arm64-v8a/libretro_gambatte.so \
             app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so

      - name: Fetch pinned Snes9x
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf snes9xcore
          git init snes9xcore
          cd snes9xcore
          git remote add origin https://github.com/libretro/snes9x.git
          git fetch --depth 1 origin "${SNES9X_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SNES9X_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro/jni/Application.mk

      - name: Build Snes9x ARM64
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("snes9xcore/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_snes9x",1))
          PY

          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd snes9xcore/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a

          test -s libs/arm64-v8a/libretro_snes9x.so
          strings libs/arm64-v8a/libretro_snes9x.so > "$RUNNER_TEMP/snes9x.strings"
          grep -qi 'snes9x' "$RUNNER_TEMP/snes9x.strings"

      - name: Install Snes9x core
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp snes9xcore/libretro/jni/libs/arm64-v8a/libretro_snes9x.so \
             app/src/main/jniLibs/arm64-v8a/libretro_snes9x.so
          test -s app/src/main/jniLibs/arm64-v8a/libretro_snes9x.so

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_snes9x.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          grep -q 'versionName "0.8.0-rc1"' app/build.gradle
          grep -q 'setSessionType("SNES")' app/src/main/java/cl/retrolink/app/SnesRoomActivity.java
          grep -q 'video.start(hostIp, 2, false)' app/src/main/java/cl/retrolink/app/SnesControllerActivity.java

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.8.0-snes-foundation-rc1-debug.apk
          sha256sum RetroLink-v0.8.0-snes-foundation-rc1-debug.apk \
            | tee RetroLink-v0.8.0-snes-foundation-rc1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.8.0-snes-foundation-rc1
          path: |
            RetroLink-v0.8.0-snes-foundation-rc1-debug.apk
            RetroLink-v0.8.0-snes-foundation-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14
