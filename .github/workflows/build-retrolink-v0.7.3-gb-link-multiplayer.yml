      - name: Static Game Boy Link validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)
          ET.parse("app/src/main/AndroidManifest.xml")

          sw = Path("app/src/main/java/cl/retrolink/app/SoftwareCoreView.java").read_text()
          link = Path("app/src/main/java/cl/retrolink/app/GameBoyLinkActivity.java").read_text()
          host = Path("app/src/main/java/cl/retrolink/app/ble/HostBleManager.java").read_text()
          lib = Path("app/src/main/java/cl/retrolink/app/GameBoyLibraryActivity.java").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          build = Path("app/build.gradle").read_text()

          assert 'gambatte_gb_link_mode' in sw
          assert 'gambatte_gb_link_network_port' in sw
          assert 'gambatte_gb_link_network_server_ip_' in sw
          assert '"Network Server"' in link
          assert '"Network Client"' in link
          assert 'setMaxPlayerNumber(2)' in link
          assert 'maxPlayerNumber' in host
          assert 'btnGbMultiplayer' in lib
          assert 'GameBoyLinkActivity' in manifest
          assert 'versionCode 33' in build
          assert 'versionName "0.7.3-rc1"' in build

          ids=set()
          for p in Path("app/src/main/res").rglob("*.xml"):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors="ignore")))
          refs=set()
          for p in Path("app/src/main/java").rglob("*.java"):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(errors="ignore")))
          missing=sorted(refs-ids)
          assert not missing, f"Missing R.id: {missing}"
          print("v0.7.3 Game Boy Link static validation PASS")
          PY

      - name: Commit v0.7.3 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v0.7.3 already committed."
          else
            git commit -m "feat(v0.7.3): add two-player Game Boy Link rooms"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;${NDK_VERSION}"             "cmake;3.22.1"

      - name: Build pinned N64 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2             NDK_PROJECT_PATH=.             NDK_APPLICATION_MK=Application.mk             APP_BUILD_SCRIPT=Android.mk             APP_ABI=arm64-v8a             GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Fetch pinned Gambatte
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gambattecore
          git init gambattecore
          cd gambattecore
          git remote add origin https://github.com/libretro/gambatte-libretro.git
          git fetch --depth 1 origin "${GAMBATTE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GAMBATTE_SHA}"
          test -f libgambatte/libretro/jni/Android.mk
          grep -q 'HAVE_NETWORK := 1' libgambatte/libretro/jni/Android.mk
          grep -q 'net_serial.cpp' Makefile.common

      - name: Build network-enabled Gambatte ARM64
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("gambattecore/libgambatte/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd gambattecore/libgambatte/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2             NDK_PROJECT_PATH=.             NDK_APPLICATION_MK=Application.mk             APP_BUILD_SCRIPT=Android.mk             APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_gambatte.so
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'gambatte_gb_link_mode'
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'Network Server'
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'Network Client'
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'GameLink network server started'

      - name: Install Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          cp gambattecore/libgambatte/libretro/jni/libs/arm64-v8a/libretro_gambatte.so              app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          grep -q 'versionName "0.7.3-rc1"' app/build.gradle
          grep -q 'GameBoyLinkActivity' app/src/main/AndroidManifest.xml
          grep -q 'gambatte_gb_link_mode' app/src/main/java/cl/retrolink/app/SoftwareCoreView.java

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.7.3-gameboy-link-2p-rc1-debug.apk
          sha256sum RetroLink-v0.7.3-gameboy-link-2p-rc1-debug.apk             | tee RetroLink-v0.7.3-gameboy-link-2p-rc1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.7.3-gameboy-link-2p-rc1
          path: |
            RetroLink-v0.7.3-gameboy-link-2p-rc1-debug.apk
            RetroLink-v0.7.3-gameboy-link-2p-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14
