name: RetroLink v1.4.0c PPSSPP Normal Flavor Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-retrolink-v1.4.0c-ppsspp-normal-flavor-fix.yml"

permissions:
  contents: write

env:
  BRANCH_NAME: codex/v0.6-ui-controls
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 28.2.13676358
  N64_CORE_SHA: 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5
  GAMBATTE_SHA: d9d6cd06382d1ced30de34d56d3609452323dab1
  SNES9X_SHA: fae2fea08f74180759ef540ee94259213f503480
  STELLA_SHA: 7d1361e407e63f29e52892655069e5fb4096e691
  PCSX_SHA: c8816799b50388e61cfe237fe2cdbb7d8175f20a
  PPSSPP_SHA: 13c1773bc24e97a2ca7bd4362b12b8859a6f71a3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Switch to development branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin "${BRANCH_NAME}"
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          grep -Eq 'versionName "(0\.9\.1|1\.0\.0|1\.0\.1|1\.0\.2|1\.1\.0|1\.2\.0|1\.3\.0|1\.4\.0)-rc1"' app/build.gradle

      - name: Apply v1.0.0 PS1 source
