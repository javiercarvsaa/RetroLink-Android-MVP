      - name: Build RetroLink v0.3
        working-directory: retrolink
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp retrolink/app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.3-n64-bridge.apk
          ls -lh RetroLink-v0.3-n64-bridge.apk

      - name: Upload RetroLink v0.3 APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.3-n64-bridge
          path: RetroLink-v0.3-n64-bridge.apk
          if-no-files-found: error
          retention-days: 14
