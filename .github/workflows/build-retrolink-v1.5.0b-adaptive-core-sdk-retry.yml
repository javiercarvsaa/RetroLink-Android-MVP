        bnNpdHkpOyB9Cn0K
        JAVA_B64
        base64 -d "$RUNNER_TEMP/PspLibraryActivity.java.b64" \
          > app/src/main/java/cl/retrolink/app/PspLibraryActivity.java

        python3 - <<'PY'
        from pathlib import Path
        import hashlib
        import re

        library_path = Path("app/src/main/java/cl/retrolink/app/PspLibraryActivity.java")
        repository_path = Path("app/src/main/java/cl/retrolink/app/PspRomRepository.java")
        library = library_path.read_text()
        repository = repository_path.read_text()

        required_library = [
            "private PspRomRepository.ImportedGame selected;",
            "private List<PspRomRepository.ImportedGame> games;",
            "PspRomRepository.listGames(this)",
            "PspRomRepository.importUri(this, uri)",
            "PspLauncher.launchGame(this, selected.file",
        ]
        for value in required_library:
            assert value in library, value

        forbidden = [
            "PspGameRepository",
            "repo.importUris(data.getData())",
            "new Ps1RomRepository",
        ]
        for value in forbidden:
            assert value not in library, value

        assert re.search(
            r"public\s+static\s+ImportedGame\s+importUri\s*\(Context\s+c,\s*Uri\s+uri\)",
            repository,
        ), "PspRomRepository.importUri(Context, Uri) missing"
        assert 'n.endsWith(".iso")' in repository
        assert 'n.endsWith(".cso")' in repository

        print("PSP Java bridge validation PASS")
        print("PspLibraryActivity SHA-256:", hashlib.sha256(library_path.read_bytes()).hexdigest())
        PY

        # Discard all Java/Gradle incremental state. The previous run reached
        # javac with an obsolete cached PspLibraryActivity implementation.
        gradle --stop || true
        rm -rf app/build ppsspp-engine/build .gradle
        find app/src/main/java -type f -name '*.java' -exec touch {} +
    - name: Build APK
      shell: bash
      run: |
        set -euxo pipefail
        gradle --no-daemon --no-build-cache --rerun-tasks \
          clean :app:assembleDebug --stacktrace --info
    - name: Validate APK
      shell: bash
      run: |
        set -euxo pipefail
        APK=app/build/outputs/apk/debug/app-debug.apk
        test -f "$APK"
        unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
        unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
        unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_snes9x.so'
        unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_atari2600.so'
        unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_ps1.so'
        unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
        unzip -l "$APK" | grep 'lib/arm64-v8a/libppsspp_jni.so'
        unzip -l "$APK" | grep 'assets/PPSSPP_LICENSE.txt'
        unzip -l "$APK" | grep 'assets/NOTICE_PPSSPP.txt'
        grep -q 'versionName "1.5.0-rc1"' app/build.gradle
        grep -q 'setSessionType("PS1")' app/src/main/java/cl/retrolink/app/Ps1RoomActivity.java
        grep -q 'configurePs1Defaults' app/src/main/java/cl/retrolink/app/Ps1GameActivity.java
        grep -q 'Ps1GpuCoreView' app/src/main/java/cl/retrolink/app/Ps1GameActivity.java
        grep -q 'RETROSR_GSR_FRAGMENT' app/src/main/java/cl/retrolink/app/Ps1GpuCoreView.java
        grep -q 'RETROSR_TEMPORAL_FRAGMENT' app/src/main/java/cl/retrolink/app/Ps1GpuCoreView.java
        grep -q 'glGenFramebuffers' app/src/main/java/cl/retrolink/app/Ps1GpuCoreView.java
        grep -q 'estimateFrameMotion' app/src/main/java/cl/retrolink/app/Ps1GpuCoreView.java
        grep -q 'Ps1GpuCoreView' app/src/main/res/layout/activity_ps1_game.xml
        grep -q 'BSD-3-Clause' app/src/main/assets/NOTICE_RETROSR_SGSR.txt
        grep -q 'info.need_fullpath' app/src/main/cpp/retrolink_native.cpp
        grep -q 'PspLauncher' app/src/main/java/cl/retrolink/app/PspLibraryActivity.java
        grep -q 'PspRomRepository.importUri(this, uri)' app/src/main/java/cl/retrolink/app/PspLibraryActivity.java
        ! grep -q 'PspGameRepository' app/src/main/java/cl/retrolink/app/PspLibraryActivity.java
        ! grep -q 'repo.importUris(data.getData())' app/src/main/java/cl/retrolink/app/PspLibraryActivity.java
        grep -q 'EnableAdhocServer' app/src/main/java/cl/retrolink/app/PspIniManager.java
        grep -q 'PpssppActivity' ppsspp-engine/src/main/AndroidManifest.xml
        grep -Fq 'return false; // RetroLink embeds the normal non-VR PPSSPP flavor.' \
          ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java
        ! grep -Fq 'BuildConfig.FLAVOR' \
          ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java
        grep -Fq 'file("${upstreamDir}/android/src/main/res")' \
          ppsspp-engine/build.gradle
        grep -Fq '<style name="Theme.ProxyTransparent"' \
          ppsspp-engine/upstream/android/src/main/res/values/themes.xml
    - name: Prepare APK
      shell: bash
      run: |
        set -euxo pipefail
        cp app/build/outputs/apk/debug/app-debug.apk \
           RetroLink-v1.5.0b-adaptive-core-sdk-retry-rc1-debug.apk
        sha256sum RetroLink-v1.5.0b-adaptive-core-sdk-retry-rc1-debug.apk \
          | tee RetroLink-v1.5.0b-adaptive-core-sdk-retry-rc1-debug.sha256
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: RetroLink-v1.5.0b-adaptive-core-sdk-retry-rc1
        path: |
          RetroLink-v1.5.0b-adaptive-core-sdk-retry-rc1-debug.apk
          RetroLink-v1.5.0b-adaptive-core-sdk-retry-rc1-debug.sha256
        if-no-files-found: error
        retention-days: 14
