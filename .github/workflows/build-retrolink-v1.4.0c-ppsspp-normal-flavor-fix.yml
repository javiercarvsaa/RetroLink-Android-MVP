          python3 - <<'PY'
          from pathlib import Path

          activity = Path("app/src/main/java/cl/retrolink/app/Ps1GameActivity.java")
          s = activity.read_text()
          old_type = "private SoftwareCoreView surface;"
          new_type = "private Ps1GpuCoreView surface;"
          if old_type in s:
              s = s.replace(old_type, new_type, 1)
          elif new_type not in s:
              raise SystemExit("Ps1GameActivity surface type marker missing")

          s = s.replace("RETROSR 2X", "RETROSR GPU 1-PASS")
          activity.write_text(s)

          layout = Path("app/src/main/res/layout/activity_ps1_game.xml")
          s = layout.read_text()
          old_view = "<cl.retrolink.app.SoftwareCoreView"
          new_view = "<cl.retrolink.app.Ps1GpuCoreView"
          if old_view in s:
              s = s.replace(old_view, new_view, 1)
          elif new_view not in s:
              raise SystemExit("PS1 layout renderer marker missing")
          layout.write_text(s)

          build = Path("app/build.gradle")
          s = build.read_text()
          if 'versionName "1.1.0-rc1"' in s:
              s = s.replace("versionCode 63", "versionCode 64", 1)
              s = s.replace('versionName "1.1.0-rc1"', 'versionName "1.2.0-rc1"', 1)
          elif ('versionName "1.2.0-rc1"' not in s
                and 'versionName "1.3.0-rc1"' not in s
                and 'versionName "1.4.0-rc1"' not in s):
              raise SystemExit("Unexpected RetroLink base version for GPU renderer")
          build.write_text(s)

          main_layout = Path("app/src/main/res/layout/activity_main.xml")
          if main_layout.is_file():
              s = main_layout.read_text()
              s = s.replace("v1.1.0 RC1", "v1.2.0 RC1")
              main_layout.write_text(s)

          print("v1.2.0 PS1 RetroSR GPU renderer applied")
          PY

