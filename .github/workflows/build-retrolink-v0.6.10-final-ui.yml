      - name: Static Final UI validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          res = Path('app/src/main/res')
          for p in res.rglob('*.xml'):
              ET.parse(p)
          ET.parse('app/src/main/AndroidManifest.xml')

          ids=set()
          for p in res.rglob('*.xml'):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          refs=set()
          for p in Path('app/src/main/java').rglob('*.java'):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          missing=sorted(refs-ids)
          assert not missing, f'Missing R.id: {missing}'

          drawables={p.stem for p in (res/'drawable').glob('*.xml')}
          drawable_refs=set()
          for p in res.rglob('*.xml'):
              drawable_refs.update(re.findall(r'@drawable/([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          missing_draw=sorted(x for x in drawable_refs if x not in drawables)
          assert not missing_draw, f'Missing drawable: {missing_draw}'

          remote=Path('app/src/main/java/cl/retrolink/app/RemoteFrameView.java').read_text()
          ctrl=Path('app/src/main/java/cl/retrolink/app/ControllerActivity.java').read_text()
          host=Path('app/src/main/java/cl/retrolink/app/HostActivity.java').read_text()
          emu=Path('app/src/main/java/cl/retrolink/app/IntegratedN64Activity.java').read_text()
          prefs=Path('app/src/main/java/cl/retrolink/app/PlayerViewportPreferences.java').read_text()
          cxml=Path('app/src/main/res/layout/activity_controller.xml').read_text()
          hxml=Path('app/src/main/res/layout/activity_host.xml').read_text()
          exml=Path('app/src/main/res/layout/activity_integrated_n64.xml').read_text()
          build=Path('app/build.gradle').read_text()

          for token in ['minZoomForPan','wantedDx','wantedDy','0.08f']:
              assert token in remote, token
          assert 'MAX_ZOOM = 1.22f' in prefs
          for token in ['btnControllerSettings','viewportPanel.bringToFront()','PLAYER REMOTO']:
              assert token in ctrl, token
          for token in ['controllerViewportPanel','btnControllerViewport','btnControllerViewZoomIn','btnControllerSettings']:
              assert token in cxml, token
          for token in ['btnHostConfig','hostConfigPanel','btnHostGraphics','btnHostStream','btnHostSplit','btnHostHudDefault']:
              assert token in host and token in hxml, token
          for token in ['emuSettingsPanel','btnEmuGraphics','btnEmuRetroSr','btnEmuSplitProfile','btnEmuAdvancedSettings']:
              assert token in emu and token in exml, token
          for name in ['panel_neon_glass','panel_neon_glass_magenta','btn_neon_dark','btn_neon_cyan','btn_neon_magenta','pill_neon_dark']:
              assert (res/'drawable'/f'{name}.xml').is_file(), name
          assert 'versionCode 25' in build
          assert 'versionName "0.6.10-rc1"' in build
          print('RetroLink v0.6.10 Final UI static checks PASS')
          print(f'IDs: {len(ids)} · Java refs: {len(refs)} · missing: {missing}')
          PY2

      - name: Commit v0.6.10 Final UI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md TEST_CHECKLIST.md docs
          if git diff --cached --quiet; then
            echo "v0.6.10 source already present."
          else
            git commit -m "feat(v0.6.10): integrate final in-game and multiplayer UI"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Update or open draft pull request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh pr view "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Draft PR already exists."
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH_NAME}" --draft \
              --title "RetroLink v0.6.10 — Final UI Polish" \
              --body "Integra el diseño final RetroLink en el emulador P1/P2-P4 y Sala Multijugador, conserva PresentSync y añade el Remote Viewport Fix para P2-P4. Todas las opciones visibles están conectadas a funciones reales."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro/jni/Application.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('n64core/libretro/jni/Android.mk')
          s = p.read_text()
          old = 'LOCAL_MODULE           := retro'
          assert old in s, 'LOCAL_MODULE retro not found'
          p.write_text(s.replace(old, 'LOCAL_MODULE           := retro_n64', 1))
          PY2

      - name: Build integrated N64 core for ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build" \
            -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build RetroLink v0.6.10 RC1 APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          grep -q 'versionName "0.6.10-rc1"' app/build.gradle
          grep -q 'wantedDx' app/src/main/java/cl/retrolink/app/RemoteFrameView.java
          grep -q 'btnControllerSettings' app/src/main/res/layout/activity_controller.xml
          grep -q 'hostConfigPanel' app/src/main/res/layout/activity_host.xml
          grep -q 'emuSettingsPanel' app/src/main/res/layout/activity_integrated_n64.xml

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.6.10-final-ui-rc1-debug.apk
          sha256sum RetroLink-v0.6.10-final-ui-rc1-debug.apk | tee RetroLink-v0.6.10-final-ui-rc1-debug.sha256

      - name: Upload RetroLink v0.6.10 Final UI RC1
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.6.10-final-ui-rc1
          path: |
            RetroLink-v0.6.10-final-ui-rc1-debug.apk
            RetroLink-v0.6.10-final-ui-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RetroLink v0.6.10 RC1 — Final UI Polish"
            echo ""
            echo "- Emulador P1 y P2-P4: menú final RetroLink integrado"
            echo "- PANTALLA: X/Y/Zoom/Centro con controles grandes y persistencia"
            echo "- Remote Viewport Fix: paneo P2-P4 visible hasta ±8%"
            echo "- Sala Multijugador: panel lateral de configuración funcional"
            echo "- Opciones reales: jugadores, gráficos, streaming, split, HUD, controles y ajustes avanzados"
            echo "- PresentSync y core N64 preservados"
            echo "- Próximo objetivo tras validación física: v0.7.0 MultiPlatform Foundation"
          } >> "$GITHUB_STEP_SUMMARY"
