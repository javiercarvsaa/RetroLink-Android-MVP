          grep -q 'Video LL' retrolink/app/src/main/java/cl/retrolink/app/net/FrameStreamClient.java
          grep -q 'conservamos solo el estado más nuevo' retrolink/app/src/main/java/cl/retrolink/app/ble/ControllerBleManager.java

      - name: Fetch pinned Mupen64Plus-Next core source
        shell: bash
        run: |
          set -euxo pipefail
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('n64core/libretro/jni/Android.mk')
          s = p.read_text()
          old = 'LOCAL_MODULE           := retro'
          assert old in s, 'LOCAL_MODULE retro not found'
          p.write_text(s.replace(old, 'LOCAL_MODULE           := retro_n64', 1))
          PY2
          grep 'LOCAL_MODULE' n64core/libretro/jni/Android.mk | head

      - name: Build integrated N64 core for ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          test -x "${NDK_ROOT}/ndk-build"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build" \
            -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so
          "${NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d libs/arm64-v8a/libretro_n64.so | grep 'SONAME.*libretro_n64.so'

      - name: Install N64 core and libretro ABI into RetroLink
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p retrolink/app/src/main/jniLibs/arm64-v8a
          mkdir -p retrolink/app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so \
             retrolink/app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h \
             retrolink/app/src/main/cpp/libretro.h
          file retrolink/app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          ls -lh retrolink/app/src/main/jniLibs/arm64-v8a/libretro_n64.so

      - name: Build RetroLink v0.4.5 APK
        shell: bash
        working-directory: retrolink
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK contents
        shell: bash
        working-directory: retrolink
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp retrolink/app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.4.5-low-latency-smooth-debug.apk
          sha256sum RetroLink-v0.4.5-low-latency-smooth-debug.apk | tee RetroLink-v0.4.5-low-latency-smooth-debug.sha256
          ls -lh RetroLink-v0.4.5-low-latency-smooth-debug.apk

      - name: Upload RetroLink v0.4.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.4.5-low-latency-smooth
          path: |
            RetroLink-v0.4.5-low-latency-smooth-debug.apk
            RetroLink-v0.4.5-low-latency-smooth-debug.sha256
          if-no-files-found: error
          retention-days: 14
