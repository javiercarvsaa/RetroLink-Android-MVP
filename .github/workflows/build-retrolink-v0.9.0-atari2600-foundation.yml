      - name: Static Atari 2600 validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          core = Path("app/src/main/java/cl/retrolink/app/CoreRegistry.java").read_text()
          repo = Path("app/src/main/java/cl/retrolink/app/Atari2600RomRepository.java").read_text()
          library = Path("app/src/main/java/cl/retrolink/app/Atari2600LibraryActivity.java").read_text()
          room = Path("app/src/main/java/cl/retrolink/app/Atari2600RoomActivity.java").read_text()
          controller = Path("app/src/main/java/cl/retrolink/app/Atari2600ControllerActivity.java").read_text()
          game = Path("app/src/main/java/cl/retrolink/app/Atari2600GameActivity.java").read_text()
          bind = Path("app/src/main/java/cl/retrolink/app/Atari2600ControlBinder.java").read_text()
          gp = Path("app/src/main/java/cl/retrolink/app/Atari2600GamepadMapper.java").read_text()
          host_ble = Path("app/src/main/java/cl/retrolink/app/ble/HostBleManager.java").read_text()
          software = Path("app/src/main/java/cl/retrolink/app/SoftwareCoreView.java").read_text()
          native = Path("app/src/main/cpp/retrolink_native.cpp").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          build = Path("app/build.gradle").read_text()

          assert '"atari2600.stella2014"' in core
          assert '"libretro_atari2600.so"' in core
          assert '"a26"' in core
          assert 'n.endsWith(".a26") || n.endsWith(".bin")' in repo

          assert 'Stella 2014' in library
          assert 'Atari2600RoomActivity.class' in library
          assert 'setSessionType("ATARI2600")' in room
          assert 'setMaxPlayerNumber(2)' in room
          assert 'Atari2600ControllerActivity.class' in room
          assert 'FrameStreamServer' in room
          assert 'P2 no necesita ROM' in room

          assert 'FrameStreamClient' in controller
          assert '"ATARI2600".equals(sessionType)' in controller
          assert 'video.start(hostIp, 2, false)' in controller
          assert 'Atari2600ControlBinder' in controller
          assert 'Atari2600ControlBinder' in game
          assert 'CoreRegistry.ATARI_2600' in game

          assert 'R.id.btnFire' in bind
          assert 'BleProtocol.B' in bind
          assert 'R.id.btnSelect' in bind and 'BleProtocol.Z' in bind
          assert 'R.id.btnReset' in bind and 'BleProtocol.START' in bind
          assert 'KEYCODE_BUTTON_A' in gp and 'KEYCODE_BUTTON_B' in gp

          assert 'else if ("ATARI2600".equals(value)) this.sessionType = "ATARI2600";' in host_ble
          assert 'core == CoreRegistry.SNES || core == CoreRegistry.ATARI_2600' in software

          # Existing native generic joypad mapping already supplies everything Stella 2014 needs:
          # B=Fire, Z=Select, START=Reset, axes/dpad=joystick.
          assert 'RETRO_DEVICE_ID_JOYPAD_B' in native
          assert 'RETRO_DEVICE_ID_JOYPAD_SELECT' in native
          assert 'RETRO_DEVICE_ID_JOYPAD_START' in native

          for cls in (
              "Atari2600ControllerActivity",
              "Atari2600GameActivity",
              "Atari2600RoomActivity",
              "Atari2600LibraryActivity"):
              assert f'android:name=".{cls}"' in manifest

          assert 'versionCode 50' in build
          assert 'versionName "0.9.0-rc1"' in build

          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)
          ET.parse("app/src/main/AndroidManifest.xml")

          ids=set()
          for p in Path("app/src/main/res").rglob("*.xml"):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)',
                                    p.read_text(errors="ignore")))

          refs=set()
          for name in (
              "Atari2600LibraryActivity.java",
              "Atari2600RoomActivity.java",
              "Atari2600ControllerActivity.java",
              "Atari2600GameActivity.java",
              "Atari2600ControlBinder.java"):
              src=Path("app/src/main/java/cl/retrolink/app/"+name).read_text(errors="ignore")
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', src))

          missing=sorted(refs-ids)
          assert not missing, f"Missing Atari R.id: {missing}"

          print("v0.9.0 Atari 2600 source validation PASS")
          PY

      - name: Commit v0.9.0 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v0.9.0 source already committed."
          else
            git commit -m "feat(v0.9.0): add Atari 2600 Stella core and RetroLink 2P"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Build pinned N64 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -s libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so \
             app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build pinned Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gambattecore
          git init gambattecore
          cd gambattecore
          git remote add origin https://github.com/libretro/gambatte-libretro.git
          git fetch --depth 1 origin "${GAMBATTE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GAMBATTE_SHA}"
          grep -q 'HAVE_NETWORK := 1' libgambatte/libretro/jni/Android.mk
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libgambatte/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libgambatte/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_gambatte.so

      - name: Install Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          cp gambattecore/libgambatte/libretro/jni/libs/arm64-v8a/libretro_gambatte.so \
             app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so

      - name: Build pinned Snes9x core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf snes9xcore
          git init snes9xcore
          cd snes9xcore
          git remote add origin https://github.com/libretro/snes9x.git
          git fetch --depth 1 origin "${SNES9X_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SNES9X_SHA}"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_snes9x",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_snes9x.so

      - name: Install Snes9x core
        shell: bash
        run: |
          set -euxo pipefail
          cp snes9xcore/libretro/jni/libs/arm64-v8a/libretro_snes9x.so \
             app/src/main/jniLibs/arm64-v8a/libretro_snes9x.so

      - name: Fetch pinned Stella 2014
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf stellacore
          git init stellacore
          cd stellacore
          git remote add origin https://github.com/libretro/stella2014-libretro.git
          git fetch --depth 1 origin "${STELLA_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${STELLA_SHA}"
          test -f jni/Android.mk
          test -f jni/Application.mk
          grep -F 'valid_extensions = "a26|bin|mvc"' libretro.cxx

      - name: Build Stella 2014 ARM64
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("stellacore/jni/Android.mk")
          s=p.read_text()
          s2,n=re.subn(r'LOCAL_MODULE\s*:=\s*retro\b',
                       'LOCAL_MODULE       := retro_atari2600',
                       s, count=1)
          assert n == 1
          p.write_text(s2)
          PY

          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd stellacore/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a

          test -s libs/arm64-v8a/libretro_atari2600.so
          strings libs/arm64-v8a/libretro_atari2600.so > "$RUNNER_TEMP/stella.strings"
          grep -qi 'stella' "$RUNNER_TEMP/stella.strings"

      - name: Install Stella core
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stellacore/jni/libs/arm64-v8a/libretro_atari2600.so \
             app/src/main/jniLibs/arm64-v8a/libretro_atari2600.so
          test -s app/src/main/jniLibs/arm64-v8a/libretro_atari2600.so

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_snes9x.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_atari2600.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          grep -q 'versionName "0.9.0-rc1"' app/build.gradle
          grep -q 'setSessionType("ATARI2600")' \
             app/src/main/java/cl/retrolink/app/Atari2600RoomActivity.java
          grep -q 'video.start(hostIp, 2, false)' \
             app/src/main/java/cl/retrolink/app/Atari2600ControllerActivity.java

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk \
             RetroLink-v0.9.0-atari2600-foundation-rc1-debug.apk
          sha256sum RetroLink-v0.9.0-atari2600-foundation-rc1-debug.apk \
            | tee RetroLink-v0.9.0-atari2600-foundation-rc1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.9.0-atari2600-foundation-rc1
          path: |
            RetroLink-v0.9.0-atari2600-foundation-rc1-debug.apk
            RetroLink-v0.9.0-atari2600-foundation-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14
