RETROLINK_PAYLOAD
          base64 --decode /tmp/retrolink-project.b64 > /tmp/retrolink-project.tar.gz
          tar -xzf /tmp/retrolink-project.tar.gz -C retrolink
          find retrolink -maxdepth 4 -type f | sort

      - name: Build debug APK
        working-directory: retrolink
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp retrolink/app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.1-debug.apk
          ls -lh RetroLink-v0.1-debug.apk

      - name: Upload RetroLink APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.1-debug
          path: RetroLink-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish test APK in Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1-test --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create v0.1-test RetroLink-v0.1-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RetroLink v0.1 test" \
            --notes "MVP Android para validar Host + controles BLE P1-P4. APK de depuración para pruebas."
