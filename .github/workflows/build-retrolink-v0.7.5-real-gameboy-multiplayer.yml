name: RetroLink v0.7.5 Real Game Boy Multiplayer

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-retrolink-v0.7.5-real-gameboy-multiplayer.yml"

permissions:
  contents: write

env:
  BRANCH_NAME: codex/v0.6-ui-controls
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 28.2.13676358
  N64_CORE_SHA: 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5
  GAMBATTE_SHA: d9d6cd06382d1ced30de34d56d3609452323dab1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Switch to development branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin "${BRANCH_NAME}"
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          grep -Eq 'versionName "0\.7\.(4|5)-rc1"' app/build.gradle

      - name: Apply v0.7.5 real Game Boy multiplayer
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionName "0.7.5-rc1"' app/build.gradle \
             && test -f app/src/main/java/cl/retrolink/app/GameBoyRomTransfer.java; then
            echo "v0.7.5 source already present."
            exit 0
