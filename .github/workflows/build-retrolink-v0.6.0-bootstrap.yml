          test -f "$RUNNER_TEMP/retrolink-src/app/src/main/java/cl/retrolink/app/ControlLayoutActivity.java"

      - name: Create or update v0.6 branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "${BRANCH_NAME}" >/dev/null 2>&1; then
            git fetch origin "${BRANCH_NAME}"
            git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          else
            git switch -c "${BRANCH_NAME}"
          fi

          rsync -a --delete             --exclude '.git/'             --exclude '.github/'             "$RUNNER_TEMP/retrolink-src/" ./

          git add -A -- ':!.github'
          if git diff --cached --quiet; then
            echo "Source already matches RetroLink v0.6.0 RC1."
          else
            git commit -m "feat(v0.6): bootstrap normalized Android source"
            git push -u origin "${BRANCH_NAME}"
          fi

      - name: Open draft pull request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh pr view "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Draft PR already exists."
          else
            gh pr create               --repo "${GITHUB_REPOSITORY}"               --base main               --head "${BRANCH_NAME}"               --draft               --title "RetroLink v0.6.0 — Neon UI, Control Layout Editor & SplitView"               --body "Bootstrap de v0.6.0 RC1 desde la baseline v0.5.1. Incluye source Android normalizado, editor de controles, corrección de Settings cortado, SplitView P1/P2, estabilidad de cierre y preservación de PresentSync. Validación física pendiente en dispositivo."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;${NDK_VERSION}"             "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('n64core/libretro/jni/Android.mk')
          s = p.read_text()
          old = 'LOCAL_MODULE           := retro'
          assert old in s, 'LOCAL_MODULE retro not found'
          p.write_text(s.replace(old, 'LOCAL_MODULE           := retro_n64', 1))
          PY

      - name: Build integrated N64 core for ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build"             -j2             NDK_PROJECT_PATH=.             NDK_APPLICATION_MK=Application.mk             APP_BUILD_SCRIPT=Android.mk             APP_ABI=arm64-v8a             GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build RetroLink v0.6.0 RC1 APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          grep -q 'versionName "0.6.0-rc1"' app/build.gradle
          grep -q 'ControlLayoutActivity' app/src/main/AndroidManifest.xml

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.6.0-rc1-debug.apk
          sha256sum RetroLink-v0.6.0-rc1-debug.apk | tee RetroLink-v0.6.0-rc1-debug.sha256

      - name: Upload RetroLink v0.6.0 RC1
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.6.0-rc1
          path: |
            RetroLink-v0.6.0-rc1-debug.apk
            RetroLink-v0.6.0-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RetroLink v0.6.0 RC1"
            echo ""
            echo "- Branch: ${BRANCH_NAME}"
            echo "- Baseline: v0.5.1 PresentSync + Clean HUD"
            echo "- Target: v0.6.0-rc1"
            echo "- APK artifact: RetroLink-v0.6.0-rc1"
            echo "- Manual validation pending: DK64, Mario Kart split-screen, control editor, Settings scroll, clean exit"
          } >> "$GITHUB_STEP_SUMMARY"
