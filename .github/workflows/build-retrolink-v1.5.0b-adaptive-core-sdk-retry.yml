name: RetroLink v1.5.0b Adaptive Core SDK Retry
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-retrolink-v1.5.0b-adaptive-core-sdk-retry.yml
permissions:
  contents: write
env:
  BRANCH_NAME: codex/v1.5-adaptive-optimizer
  BASE_BRANCH: codex/v0.6-ui-controls
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 28.2.13676358
  N64_CORE_SHA: 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5
  GAMBATTE_SHA: d9d6cd06382d1ced30de34d56d3609452323dab1
  SNES9X_SHA: fae2fea08f74180759ef540ee94259213f503480
  STELLA_SHA: 7d1361e407e63f29e52892655069e5fb4096e691
  PCSX_SHA: c8816799b50388e61cfe237fe2cdbb7d8175f20a
  PPSSPP_SHA: 13c1773bc24e97a2ca7bd4362b12b8859a6f71a3
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true
    - name: Switch to protected v1.5 branch
      shell: bash
      run: |-
        set -euxo pipefail
        git fetch origin "${BASE_BRANCH}" || true
        git fetch origin "${BRANCH_NAME}" || true
        if git show-ref --verify --quiet "refs/remotes/origin/${BRANCH_NAME}"; then
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
        else
          git switch -C "${BRANCH_NAME}" "origin/${BASE_BRANCH}"
        fi
        grep -Eq 'versionName "(1\.4\.0|1\.5\.0)-rc1"' app/build.gradle
    - name: Verify stable v1.4 source baseline
      shell: bash
      run: |-
        set -euxo pipefail
        python3 - <<'PY'
        from pathlib import Path
        build=Path('app/build.gradle').read_text()
        registry=Path('app/src/main/java/cl/retrolink/app/CoreRegistry.java').read_text()
        assert 'versionCode 66' in build or 'versionCode 67' in build
        assert 'versionName "1.4.0-rc1"' in build or 'versionName "1.5.0-rc1"' in build
        for token in ['n64.mupen64plus-next','ps1.pcsx_rearmed','snes.snes9x','atari2600.stella2014','psp.ppsspp']:
            assert token in registry, token
        print('Stable v1.4 base verified')
        PY
    - name: Apply v1.5 Adaptive Core stability increment
      shell: bash
      run: |-
        set -euxo pipefail
        mkdir -p "$(dirname app/src/main/java/cl/retrolink/app/OptimizationProfileStore.java)"
        cat > app/src/main/java/cl/retrolink/app/OptimizationProfileStore.java.b64 <<'PAYLOAD_2'
        
        PAYLOAD_2
        base64 -d app/src/main/java/cl/retrolink/app/OptimizationProfileStore.java.b64 > app/src/main/java/cl/retrolink/app/OptimizationProfileStore.java
        mkdir -p "$(dirname app/src/main/java/cl/retrolink/app/FrameTimeMetrics.java)"
        cat > app/src/main/java/cl/retrolink/app/FrameTimeMetrics.java.b64 <<'PAYLOAD_7'
        
        PAYLOAD_7
        base64 -d app/src/main/java/cl/retrolink/app/FrameTimeMetrics.java.b64 > app/src/main/java/cl/retrolink/app/FrameTimeMetrics.java
        mkdir -p "$(dirname app/src/main/java/cl/retrolink/app/AdaptiveOptimizationEngine.java)"
        cat > app/src/main/java/cl/retrolink/app/AdaptiveOptimizationEngine.java.b64 <<'PAYLOAD_12'
        
        PAYLOAD_12
        base64 -d app/src/main/java/cl/retrolink/app/AdaptiveOptimizationEngine.java.b64 > app/src/main/java/cl/retrolink/app/AdaptiveOptimizationEngine.java
        mkdir -p "$(dirname app/src/main/java/cl/retrolink/app/AdaptiveRuntimeSession.java)"
        cat > app/src/main/java/cl/retrolink/app/AdaptiveRuntimeSession.java.b64 <<'PAYLOAD_17'
        
        PAYLOAD_17
        base64 -d app/src/main/java/cl/retrolink/app/AdaptiveRuntimeSession.java.b64 > app/src/main/java/cl/retrolink/app/AdaptiveRuntimeSession.java
        mkdir -p "$(dirname app/src/main/java/cl/retrolink/app/OptimizationSettingsActivity.java)"
        cat > app/src/main/java/cl/retrolink/app/OptimizationSettingsActivity.java.b64 <<'PAYLOAD_22'
        
        PAYLOAD_22
        base64 -d app/src/main/java/cl/retrolink/app/OptimizationSettingsActivity.java.b64 > app/src/main/java/cl/retrolink/app/OptimizationSettingsActivity.java
        mkdir -p "$(dirname app/src/main/res/layout/activity_optimization_settings.xml)"
        cat > app/src/main/res/layout/activity_optimization_settings.xml.b64 <<'PAYLOAD_27'
        
        PAYLOAD_27
        base64 -d app/src/main/res/layout/activity_optimization_settings.xml.b64 > app/src/main/res/layout/activity_optimization_settings.xml
        mkdir -p "$(dirname docs/RETROLINK_V1_5_ADAPTIVE_CORE.md)"
        cat > docs/RETROLINK_V1_5_ADAPTIVE_CORE.md.b64 <<'PAYLOAD_32'
        
        PAYLOAD_32
        base64 -d docs/RETROLINK_V1_5_ADAPTIVE_CORE.md.b64 > docs/RETROLINK_V1_5_ADAPTIVE_CORE.md
        mkdir -p "$RUNNER_TEMP"
        cat > $RUNNER_TEMP/apply_v150.py.b64 <<'PAYLOAD_37'
        
        PAYLOAD_37
        base64 -d $RUNNER_TEMP/apply_v150.py.b64 > $RUNNER_TEMP/apply_v150.py
        python3 "$RUNNER_TEMP/apply_v150.py"
    - name: Static adaptive and regression validation
      shell: bash
      run: |-
        set -euxo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import xml.etree.ElementTree as ET

        java = Path('app/src/main/java/cl/retrolink/app')
        build = Path('app/build.gradle').read_text()
        registry = (java / 'CoreRegistry.java').read_text()
        software = (java / 'SoftwareCoreView.java').read_text()
        ps1 = (java / 'Ps1GpuCoreView.java').read_text()
        psp = (java / 'PspIniManager.java').read_text()
        n64 = (java / 'EmulatorSurfaceView.java').read_text()
        manifest = Path('app/src/main/AndroidManifest.xml').read_text()

        assert 'versionCode 67' in build
        assert 'versionName "1.5.0-rc1"' in build
        for name in [
            'OptimizationProfileStore.java', 'FrameTimeMetrics.java',
            'AdaptiveOptimizationEngine.java', 'AdaptiveRuntimeSession.java',
            'OptimizationSettingsActivity.java'
        ]:
            assert (java / name).is_file(), name

        # Actual core/platform identities: never infer or rename them.
        assert 'n64.mupen64plus-next' in registry and 'libretro_n64.so' in registry
        assert 'ps1.pcsx_rearmed' in registry and 'libretro_ps1.so' in registry
        assert 'snes.snes9x' in registry and 'libretro_snes9x.so' in registry
        assert 'atari2600.stella2014' in registry and 'Atari 2600' in registry
        assert 'libretro_atari2600.so' in registry
        assert 'psp.ppsspp' in registry and 'libppsspp_jni.so' in registry

        # Optimizer architecture and factual classification.
        engine = (java / 'AdaptiveOptimizationEngine.java').read_text()
        runtime = (java / 'AdaptiveRuntimeSession.java').read_text()
        store = (java / 'OptimizationProfileStore.java').read_text()
        assert 'rule-based' in engine
        assert 'CoreRegistry.N64' in engine and 'CoreRegistry.PS1' in engine
        assert 'CoreRegistry.PSP' in engine and 'CoreRegistry.SNES' in engine
        assert 'CoreRegistry.ATARI_2600' in engine
        assert 'PerformanceHintManager' in runtime
        assert 'OnThermalStatusChangedListener' in runtime
        assert 'CALIBRATION_MIN_NS = 12_000_000_000L' in runtime
        assert 'SUSTAINED_CHECK_NS = 60_000_000_000L' in runtime
        assert 'Debug.getPss()' in runtime
        assert 'SHA-256' in store and 'stable_' in store
        assert 'experimental_temporal' in store

        # Regression guards for previously fixed failures.
        assert 'nativeInit(corePath, romPath, systemDir, saveDir)' in software
        assert 'FrameStreamServer.hasRemoteClients()' in software
        assert 'for (int p = 1; p <= 4; p++)' in software
        assert 'nativeSetInput(p, in.mask, in.x, in.y)' in software
        assert 'pcsx_rearmed_frameskip_type", "disabled"' in ps1
        assert 'pcsx_rearmed_memcard1' in ps1
        assert 'shutdownCoreAndWait' in (java / 'Ps1GameActivity.java').read_text()
        assert 'shutdownCoreAndWait' in (java / 'IntegratedN64Activity.java').read_text()
        for name in ['Ps1ControllerActivity.java', 'SnesControllerActivity.java',
                     'Atari2600ControllerActivity.java', 'PspRoomActivity.java']:
            assert (java / name).is_file(), name

        # PSP Ad Hoc/network keys remain untouched.
        for token in ['EnableWlan', 'EnableAdhocServer', 'proAdhocServer',
                      'WlanAdhocChannel', 'RetroLinkP2']:
            assert token in psp, token
        assert 'FrameSkip", "0"' in psp and 'AutoFrameSkip", "False"' in psp

        # Pixel art must remain nearest-neighbour; no model/runtime is bundled yet.
        assert 'paint.setFilterBitmap(this.core == CoreRegistry.PS1' in software
        assert 'tensorflow' not in build.lower()
        assert 'litert' not in build.lower()
        assert 'OptimizationSettingsActivity' in manifest
        assert 'setAdaptivePlan' in n64 and 'setAdaptivePlan' in ps1 and 'setAdaptivePlan' in software

        ET.parse('app/src/main/AndroidManifest.xml')
        ET.parse('app/src/main/res/layout/activity_settings.xml')
        ET.parse('app/src/main/res/layout/activity_optimization_settings.xml')
        print('v1.5 Adaptive Core static and regression validation PASS')
        PY
    - name: Commit v1.5 source
      shell: bash
      run: |-
        set -euxo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add app docs
        if git diff --cached --quiet; then
          echo "v1.5 source already committed."
        else
          git commit -m "feat(v1.5.0): add rule-based adaptive optimization core"
          git push origin "HEAD:${BRANCH_NAME}"
        fi
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Gradle 9.4.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.4.1
    - name: Install Android SDK NDK CMake with validated retries
      shell: bash
      run: |
        set -euxo pipefail
        SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        test -x "$SDKMANAGER"
        yes | "$SDKMANAGER" --licenses >/dev/null || true

        clean_sdk_download_state() {
          rm -rf "${ANDROID_SDK_ROOT}/.temp" "${HOME}/.android/cache" || true
          mkdir -p "${HOME}/.android"
        }

        install_with_retry() {
          local package="$1"
          local marker="$2"
          local target_dir="${3:-}"
          if test -e "$marker"; then
            echo "Reusing installed SDK package: $package"
            return 0
          fi
          for attempt in 1 2 3; do
            echo "Installing $package (attempt ${attempt}/3)"
            clean_sdk_download_state
            if test -n "$target_dir"; then
              rm -rf "$target_dir" || true
            fi
            if "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "$package"; then
              if test -e "$marker"; then
                echo "Validated SDK package: $package"
                return 0
              fi
            fi
            sleep $((attempt * 5))
          done
          return 1
        }

        install_with_retry           "platform-tools"           "${ANDROID_SDK_ROOT}/platform-tools/adb"
        install_with_retry           "platforms;android-36"           "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"           "${ANDROID_SDK_ROOT}/platforms/android-36"
        install_with_retry           "build-tools;36.0.0"           "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"           "${ANDROID_SDK_ROOT}/build-tools/36.0.0"
        install_with_retry           "cmake;3.22.1"           "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake"           "${ANDROID_SDK_ROOT}/cmake/3.22.1"

        NDK_DIR="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        if ! install_with_retry             "ndk;${NDK_VERSION}"             "${NDK_DIR}/source.properties"             "${NDK_DIR}"; then
          echo "sdkmanager NDK download remained invalid; using the official r28c archive fallback."
          clean_sdk_download_state
          rm -rf "$NDK_DIR"
          mkdir -p "${ANDROID_SDK_ROOT}/ndk"
          TMP_NDK="$(mktemp -d)"
          trap 'rm -rf "$TMP_NDK"' EXIT
          curl --fail --location             --retry 5 --retry-delay 5 --retry-all-errors             --output "${TMP_NDK}/android-ndk-r28c-linux.zip"             "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          unzip -tq "${TMP_NDK}/android-ndk-r28c-linux.zip"
          unzip -q "${TMP_NDK}/android-ndk-r28c-linux.zip" -d "$TMP_NDK"
          test -f "${TMP_NDK}/android-ndk-r28c/source.properties"
          mv "${TMP_NDK}/android-ndk-r28c" "$NDK_DIR"
        fi

        test -f "${NDK_DIR}/source.properties"
        test -x "${NDK_DIR}/ndk-build"
        grep -q "Pkg.Revision = ${NDK_VERSION}" "${NDK_DIR}/source.properties"
        "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake" --version
        "${NDK_DIR}/ndk-build" --version
    - name: Validate Android toolchain before native builds
      shell: bash
      run: |
        set -euxo pipefail
        test -f "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
        test -x "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
        test -x "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake"
        test -f "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/source.properties"
        test -x "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/ndk-build"
        grep -q "Pkg.Revision = ${NDK_VERSION}"           "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/source.properties"
        echo "Android SDK/NDK/CMake toolchain validation PASS"

    - name: Fetch pinned PPSSPP 1.20.4
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf ppsspp-engine/upstream
        git init ppsspp-engine/upstream
        cd ppsspp-engine/upstream
        git remote add origin https://github.com/hrydgard/ppsspp.git
        git fetch --depth 1 origin "${PPSSPP_SHA}"
        git checkout --detach FETCH_HEAD
        git submodule sync --recursive
        git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
        test -f CMakeLists.txt
        test -f android/src/org/ppsspp/ppsspp/PpssppActivity.java
        test -f android/src/main/proto/tombstone.proto
        test -d assets
        grep -q 'add_library(ppsspp_jni SHARED' CMakeLists.txt
        cp LICENSE.TXT ../src/main/assets/PPSSPP_LICENSE.txt
        test -s ../src/main/assets/PPSSPP_LICENSE.txt
        git rev-parse HEAD | grep -q "${PPSSPP_SHA}"
    - name: Patch PPSSPP normal flavor and proxy theme resources
      shell: bash
      run: |
        set -euxo pipefail
        python3 - <<'PY'
        from pathlib import Path

        source = Path(
            "ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java"
        )
        text = source.read_text()
        old = 'return BuildConfig.FLAVOR.startsWith("vr");'
        new = 'return false; // RetroLink embeds the normal non-VR PPSSPP flavor.'

        if old in text:
            assert text.count(old) == 1, "Unexpected BuildConfig.FLAVOR reference count"
            text = text.replace(old, new, 1)
            source.write_text(text)
        else:
            assert new in text, "PPSSPP VR flavor guard not found"

        updated = source.read_text()
        assert new in updated
        assert "BuildConfig.FLAVOR" not in updated

        engine = Path("ppsspp-engine/build.gradle")
        engine_text = engine.read_text()
        required_res = 'file("${upstreamDir}/android/src/main/res")'
        assert required_res in engine_text, "PPSSPP default Android resources are not configured"

        theme = Path(
            "ppsspp-engine/upstream/android/src/main/res/values/themes.xml"
        )
        assert theme.is_file() and theme.stat().st_size > 0, theme
        assert '<style name="Theme.ProxyTransparent"' in theme.read_text()
        print("PPSSPP normal-flavor and proxy-theme resource patch PASS")
        PY
        grep -Fq 'return false; // RetroLink embeds the normal non-VR PPSSPP flavor.' \
          ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java
        ! grep -Fq 'BuildConfig.FLAVOR' \
          ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java
        grep -Fq 'file("${upstreamDir}/android/src/main/res")' \
          ppsspp-engine/build.gradle
        grep -Fq '<style name="Theme.ProxyTransparent"' \
          ppsspp-engine/upstream/android/src/main/res/values/themes.xml
    - name: Preflight PPSSPP Java compilation
      shell: bash
      run: |
        set -euxo pipefail
        gradle --no-daemon --no-build-cache \
          :ppsspp-engine:compileDebugJavaWithJavac --stacktrace --info
        CLASS_FILE="$(find ppsspp-engine/build -type f \
          -path '*/org/ppsspp/ppsspp/PpssppActivity.class' -print -quit)"
        test -n "$CLASS_FILE"
        test -s "$CLASS_FILE"
        echo "PPSSPP Java preflight class: $CLASS_FILE"
    - name: Preflight PPSSPP manifest and app resource linking
      shell: bash
      run: |
        set -euxo pipefail
        THEME_FILE="ppsspp-engine/upstream/android/src/main/res/values/themes.xml"
        test -s "$THEME_FILE"
        grep -Fq '<style name="Theme.ProxyTransparent"' "$THEME_FILE"
        grep -Fq 'file("${upstreamDir}/android/src/main/res")' \
          ppsspp-engine/build.gradle
        gradle --no-daemon --no-build-cache \
          :ppsspp-engine:processDebugManifest \
          :app:processDebugResources \
          --stacktrace --info
        MERGED_MANIFEST="ppsspp-engine/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml"
        test -s "$MERGED_MANIFEST"
        grep -Fq '@style/Theme.ProxyTransparent' "$MERGED_MANIFEST"
        echo "PPSSPP proxy-theme resource linking preflight PASS"
    - name: Build pinned N64 core
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf n64core
        git init n64core
        cd n64core
        git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
        git fetch --depth 1 origin "${N64_CORE_SHA}"
        git checkout --detach FETCH_HEAD
        python3 - <<'PY'
        from pathlib import Path
        p=Path("libretro/jni/Android.mk")
        s=p.read_text()
        old="LOCAL_MODULE           := retro"
        assert old in s
        p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
        PY
        export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        cd libretro/jni
        "${NDK_ROOT}/ndk-build" -j2 \
          NDK_PROJECT_PATH=. \
          NDK_APPLICATION_MK=Application.mk \
          APP_BUILD_SCRIPT=Android.mk \
          APP_ABI=arm64-v8a \
          GLES3=1
        test -s libs/arm64-v8a/libretro_n64.so
    - name: Install N64 core and libretro ABI
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
        cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so \
           app/src/main/jniLibs/arm64-v8a/libretro_n64.so
        cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h
    - name: Build pinned Gambatte core
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf gambattecore
        git init gambattecore
        cd gambattecore
        git remote add origin https://github.com/libretro/gambatte-libretro.git
        git fetch --depth 1 origin "${GAMBATTE_SHA}"
        git checkout --detach FETCH_HEAD
        python3 - <<'PY'
        from pathlib import Path
        p=Path("libgambatte/libretro/jni/Android.mk")
        s=p.read_text()
        old="LOCAL_MODULE    := retro"
        assert old in s
        p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
        PY
        export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        cd libgambatte/libretro/jni
        "${NDK_ROOT}/ndk-build" -j2 \
          NDK_PROJECT_PATH=. \
          NDK_APPLICATION_MK=Application.mk \
          APP_BUILD_SCRIPT=Android.mk \
          APP_ABI=arm64-v8a
        test -s libs/arm64-v8a/libretro_gambatte.so
    - name: Install Gambatte core
      shell: bash
      run: |
        set -euxo pipefail
        cp gambattecore/libgambatte/libretro/jni/libs/arm64-v8a/libretro_gambatte.so \
           app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so
    - name: Build pinned Snes9x core
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf snes9xcore
        git init snes9xcore
        cd snes9xcore
        git remote add origin https://github.com/libretro/snes9x.git
        git fetch --depth 1 origin "${SNES9X_SHA}"
        git checkout --detach FETCH_HEAD
        python3 - <<'PY'
        from pathlib import Path
        p=Path("libretro/jni/Android.mk")
        s=p.read_text()
        old="LOCAL_MODULE    := retro"
        assert old in s
        p.write_text(s.replace(old,"LOCAL_MODULE    := retro_snes9x",1))
        PY
        export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        cd libretro/jni
        "${NDK_ROOT}/ndk-build" -j2 \
          NDK_PROJECT_PATH=. \
          NDK_APPLICATION_MK=Application.mk \
          APP_BUILD_SCRIPT=Android.mk \
          APP_ABI=arm64-v8a
        test -s libs/arm64-v8a/libretro_snes9x.so
    - name: Install Snes9x core
      shell: bash
      run: |
        set -euxo pipefail
        cp snes9xcore/libretro/jni/libs/arm64-v8a/libretro_snes9x.so \
           app/src/main/jniLibs/arm64-v8a/libretro_snes9x.so
    - name: Build pinned Stella 2014 core
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf stellacore
        git init stellacore
        cd stellacore
        git remote add origin https://github.com/libretro/stella2014-libretro.git
        git fetch --depth 1 origin "${STELLA_SHA}"
        git checkout --detach FETCH_HEAD
        python3 - <<'PY'
        from pathlib import Path
        import re
        p=Path("jni/Android.mk")
        s=p.read_text()
        s2,n=re.subn(r'LOCAL_MODULE\s*:=\s*retro\b',
                     'LOCAL_MODULE       := retro_atari2600', s, count=1)
        assert n == 1
        p.write_text(s2)
        PY
        export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        cd jni
        "${NDK_ROOT}/ndk-build" -j2 \
          NDK_PROJECT_PATH=. \
          NDK_APPLICATION_MK=Application.mk \
          APP_BUILD_SCRIPT=Android.mk \
          APP_ABI=arm64-v8a
        test -s libs/arm64-v8a/libretro_atari2600.so
    - name: Install Stella core
      shell: bash
      run: |
        set -euxo pipefail
        cp stellacore/jni/libs/arm64-v8a/libretro_atari2600.so \
           app/src/main/jniLibs/arm64-v8a/libretro_atari2600.so
    - name: Fetch pinned PCSX-ReARMed
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf pcsxcore
        git init pcsxcore
        cd pcsxcore
        git remote add origin https://github.com/libretro/pcsx_rearmed.git
        git fetch --depth 1 origin "${PCSX_SHA}"
        git checkout --detach FETCH_HEAD
        test "$(git rev-parse HEAD)" = "${PCSX_SHA}"
        test -f jni/Android.mk
        test -f jni/Application.mk
        grep -F 'info->library_name     = "PCSX-ReARMed"' frontend/libretro.c
        grep -F 'info->need_fullpath    = true' frontend/libretro.c
        grep -F 'bin|cue|img|mdf|pbp|toc|cbn|m3u|chd|iso|exe' frontend/libretro.c
    - name: Build PCSX-ReARMed ARM64
      shell: bash
      run: |
        set -euxo pipefail
        python3 - <<'PY'
        from pathlib import Path
        import re
        p=Path("pcsxcore/jni/Android.mk")
        s=p.read_text()
        s2,n=re.subn(r'LOCAL_MODULE\s*:=\s*retro\b',
                     'LOCAL_MODULE        := retro_ps1', s, count=1)
        assert n == 1
        p.write_text(s2)
        PY

        export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        cd pcsxcore/jni
        "${NDK_ROOT}/ndk-build" -j2 \
          NDK_PROJECT_PATH=. \
          NDK_APPLICATION_MK=Application.mk \
          APP_BUILD_SCRIPT=Android.mk \
          APP_ABI=arm64-v8a

        test -s libs/arm64-v8a/libretro_ps1.so
        strings libs/arm64-v8a/libretro_ps1.so > "$RUNNER_TEMP/pcsx.strings"
        grep -qi 'PCSX-ReARMed' "$RUNNER_TEMP/pcsx.strings"
        grep -q 'pcsx_rearmed_neon_enhancement_enable' "$RUNNER_TEMP/pcsx.strings"
    - name: Install PCSX-ReARMed core
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p app/src/main/jniLibs/arm64-v8a
        cp pcsxcore/jni/libs/arm64-v8a/libretro_ps1.so \
           app/src/main/jniLibs/arm64-v8a/libretro_ps1.so
        test -s app/src/main/jniLibs/arm64-v8a/libretro_ps1.so
