          python3 - <<'PY'
          from pathlib import Path
          import re

          # Root Gradle plugins and modules.
          p = Path("build.gradle")
          s = p.read_text()
          if "id 'com.android.library' version '9.2.0' apply false" not in s:
              s = s.replace("id 'com.android.application' version '9.2.0' apply false",
                            "id 'com.android.application' version '9.2.0' apply false\n"
                            "    id 'com.android.library' version '9.2.0' apply false\n"
                            "    id 'com.google.protobuf' version '0.10.0' apply false", 1)
          elif "id 'com.google.protobuf' version '0.10.0' apply false" not in s:
              s = s.replace("id 'com.android.library' version '9.2.0' apply false",
                            "id 'com.android.library' version '9.2.0' apply false\n"
                            "    id 'com.google.protobuf' version '0.10.0' apply false", 1)
          p.write_text(s)

          p = Path("settings.gradle")
          s = p.read_text()
          if 'include(":ppsspp-engine")' not in s and "include ':ppsspp-engine'" not in s:
              s += '\ninclude(":ppsspp-engine")\n'
          p.write_text(s)

          p = Path("gradle.properties")
          s = p.read_text()
          s = re.sub(r'org\.gradle\.jvmargs=.*',
                     'org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8', s, count=1)
          if 'android.useAndroidX=' in s:
              s = re.sub(r'android\.useAndroidX=.*', 'android.useAndroidX=true', s, count=1)
          else:
              s += '\nandroid.useAndroidX=true\n'
          p.write_text(s)

          # App dependency and version.
          p = Path("app/build.gradle")
          s = p.read_text()
          if "implementation project(':ppsspp-engine')" not in s:
              if 'dependencies {' in s:
                  s = s.replace('dependencies {', "dependencies {\n    implementation project(':ppsspp-engine')", 1)
              else:
                  s += "\ndependencies {\n    implementation project(':ppsspp-engine')\n}\n"
          if 'versionName "1.3.0-rc1"' in s:
              s = s.replace('versionCode 65', 'versionCode 66', 1)
              s = s.replace('versionName "1.3.0-rc1"', 'versionName "1.4.0-rc1"', 1)
          elif 'versionName "1.4.0-rc1"' not in s:
              raise SystemExit("Unexpected RetroLink base version for PSP")
          p.write_text(s)

          # Platform registry. PSP ISO/PBP overlaps PS1, so generic auto-detection only
          # claims the unambiguous CSO/ELF formats; PSP library handles all formats.
          p = Path("app/src/main/java/cl/retrolink/app/CoreRegistry.java")
          s = p.read_text()
          psp_decl = """    public static final Core PSP = new Core(
                  "psp.ppsspp", "Sony PlayStation Portable", "PSP",
                  "libppsspp_jni.so", "iso|cso|chd|pbp|elf", true, true);

          """
          if 'public static final Core PSP' not in s:
              s = s.replace('    private CoreRegistry() {}', psp_decl + '    private CoreRegistry() {}', 1)
          if 'if (PSP.id.equals(id)) return PSP;' not in s:
              s = s.replace('        if (PS1.id.equals(id)) return PS1;',
                            '        if (PS1.id.equals(id)) return PS1;\n'
                            '        if (PSP.id.equals(id)) return PSP;', 1)
          if 'n.endsWith(".cso") || n.endsWith(".elf")' not in s:
              s = s.replace('    public static Core forFileName(String name) {',
                            '    public static Core forFileName(String name) {\n'
                            '        String n = name == null ? "" : name.toLowerCase(Locale.US);\n'
                            '        if (n.endsWith(".cso") || n.endsWith(".elf")) return PSP;', 1)
          p.write_text(s)

          # Add PSP entry to the shared library screen.
          p = Path("app/src/main/java/cl/retrolink/app/LibraryActivity.java")
          s = p.read_text()
          if 'R.id.btnLibraryPsp' not in s:
              anchor = '        findViewById(R.id.btnLibraryPs1).setOnClickListener(v -> startActivity(new Intent(this, Ps1LibraryActivity.class)));'
              if anchor not in s:
                  raise SystemExit("LibraryActivity PSP anchor missing")
              s = s.replace(anchor, anchor + '\n'
                            '        findViewById(R.id.btnLibraryPsp).setOnClickListener(v -> startActivity(new Intent(this, PspLibraryActivity.class)));', 1)
          p.write_text(s)

          p = Path("app/src/main/res/layout/activity_library.xml")
          s = p.read_text()
          if '@+id/btnLibraryPsp' not in s:
              cover = re.search(r'\s*<TextView android:id="@\+id/txtLibraryCoverStatus"[^>]*/>\s*<Button android:id="@\+id/btnLibraryRefreshCovers"[^>]*/>', s)
              if not cover:
                  raise SystemExit("Library cover row anchor missing")
              moved = cover.group(0)
              psp = ('\n            <TextView android:id="@+id/btnLibraryPsp" android:layout_width="100dp" '
                     'android:layout_height="match_parent" android:layout_marginLeft="7dp" '
                     'android:background="@drawable/btn_secondary_neon" android:clickable="true" '
                     'android:focusable="true" android:gravity="center" android:text="PSP" '
                     'android:textColor="@color/retro_text" android:textSize="9sp" android:textStyle="bold" />')
              replacement = psp + '\n        </LinearLayout>\n\n'
              replacement += ('        <LinearLayout android:layout_width="match_parent" android:layout_height="42dp" '
                              'android:layout_marginTop="7dp" android:orientation="horizontal">')
              replacement += moved + '\n        </LinearLayout>'
              start, end = cover.span()
              # Remove the original closing tag immediately following the moved controls.
              tail = s[end:]
              mclose = re.match(r'\s*</LinearLayout>', tail)
              if not mclose:
                  raise SystemExit("Library platform row closing tag missing")
              s = s[:start] + replacement + tail[mclose.end():]
          p.write_text(s)

          # App permissions and PSP activities.
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.CHANGE_WIFI_MULTICAST_STATE' not in s:
              s = s.replace('    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />',
                            '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />\n'
                            '    <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />\n'
                            '    <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />', 1)
          if 'android:name=".PspLibraryActivity"' not in s:
              activities = """
                  <activity
                      android:name=".PspRoomActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape" />

                  <activity
                      android:name=".PspLibraryActivity"
                      android:exported="false"
                      android:screenOrientation="sensorLandscape" />

          """
              s = s.replace('        <activity\n            android:name=".ProfileActivity"', activities + '        <activity\n            android:name=".ProfileActivity"', 1)
          p.write_text(s)

          # Visible version marker.
          p = Path("app/src/main/res/layout/activity_main.xml")
          s = p.read_text()
          s = s.replace(r'v1.3.0 RC1\nPS1 FOUNDATION', r'v1.4.0 RC1\nPSP · PPSSPP')
          s = s.replace('Elegir juego N64', 'Biblioteca multiplataforma')
          p.write_text(s)

          print("v1.4.0 PSP PPSSPP foundation applied")
          PY

      - name: Static PSP validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          root = Path('.')
          required = [
              'app/src/main/java/cl/retrolink/app/PspRomRepository.java',
              'app/src/main/java/cl/retrolink/app/PspCoverArtManager.java',
              'app/src/main/java/cl/retrolink/app/PspIniManager.java',
              'app/src/main/java/cl/retrolink/app/PspLauncher.java',
              'app/src/main/java/cl/retrolink/app/PspNetworkInfo.java',
              'app/src/main/java/cl/retrolink/app/PspAdhocLock.java',
              'app/src/main/java/cl/retrolink/app/PspLibraryActivity.java',
              'app/src/main/java/cl/retrolink/app/PspRoomActivity.java',
              'app/src/main/res/layout/activity_psp_library.xml',
              'app/src/main/res/layout/activity_psp_room.xml',
              'ppsspp-engine/build.gradle',
              'ppsspp-engine/src/main/AndroidManifest.xml',
              'ppsspp-engine/src/main/assets/NOTICE_PPSSPP.txt',
          ]
          for name in required:
              p = Path(name)
              assert p.is_file() and p.stat().st_size > 20, name

          build = Path('app/build.gradle').read_text()
          registry = Path('app/src/main/java/cl/retrolink/app/CoreRegistry.java').read_text()
          library = Path('app/src/main/java/cl/retrolink/app/LibraryActivity.java').read_text()
          launcher = Path('app/src/main/java/cl/retrolink/app/PspLauncher.java').read_text()
          ini = Path('app/src/main/java/cl/retrolink/app/PspIniManager.java').read_text()
          room = Path('app/src/main/java/cl/retrolink/app/PspRoomActivity.java').read_text()
          engine = Path('ppsspp-engine/build.gradle').read_text()
          manifest = Path('app/src/main/AndroidManifest.xml').read_text()
          engine_manifest = Path('ppsspp-engine/src/main/AndroidManifest.xml').read_text()
          notice = Path('ppsspp-engine/src/main/assets/NOTICE_PPSSPP.txt').read_text()

          assert 'versionCode 66' in build
          assert 'versionName "1.4.0-rc1"' in build
          assert "implementation project(':ppsspp-engine')" in build
          assert 'public static final Core PSP' in registry
          assert 'libppsspp_jni.so' in registry
          assert 'R.id.btnLibraryPsp' in library
          assert 'org.ppsspp.ppsspp.PpssppActivity' in launcher
          assert 'org.ppsspp.ppsspp.Shortcuts' in launcher
          assert 'InternalResolution' in ini and 'LowLatencyPresent' in ini
          assert 'EnableAdhocServer' in ini and 'proAdhocServer' in ini
          assert 'Manifest.permission.NEARBY_WIFI_DEVICES' in room
          assert "id 'com.android.library'" in engine
          assert "targets 'ppsspp_jni'" in engine
          assert 'protobuf-javalite' in engine
          assert 'PpssppActivity' in engine_manifest
          assert 'GNU General Public License' in notice
          assert 'android.permission.CHANGE_WIFI_MULTICAST_STATE' in manifest
          assert 'android:name=".PspLibraryActivity"' in manifest
          assert 'android:name=".PspRoomActivity"' in manifest

          for p in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('app/src/main/AndroidManifest.xml')
          ET.parse('ppsspp-engine/src/main/AndroidManifest.xml')

          ids = set()
          for p in Path('app/src/main/res').rglob('*.xml'):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          refs = set()
          for name in ('PspLibraryActivity.java', 'PspRoomActivity.java'):
              src = Path('app/src/main/java/cl/retrolink/app/' + name).read_text(errors='ignore')
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', src))
          missing = sorted(refs - ids)
          assert not missing, f'Missing PSP R.id: {missing}'

          print('v1.4.0 PSP PPSSPP source validation PASS')
          PY

      - name: Commit v1.4.0 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app ppsspp-engine settings.gradle build.gradle gradle.properties
          if git diff --cached --quiet; then
            echo "v1.4.0 source already committed."
          else
            git commit -m "feat(v1.4.0): integrate PSP with embedded PPSSPP and Ad Hoc rooms"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Fetch pinned PPSSPP 1.20.4
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf ppsspp-engine/upstream
          git init ppsspp-engine/upstream
          cd ppsspp-engine/upstream
          git remote add origin https://github.com/hrydgard/ppsspp.git
          git fetch --depth 1 origin "${PPSSPP_SHA}"
          git checkout --detach FETCH_HEAD
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
          test -f CMakeLists.txt
          test -f android/src/org/ppsspp/ppsspp/PpssppActivity.java
          test -f android/src/main/proto/tombstone.proto
          test -d assets
          grep -q 'add_library(ppsspp_jni SHARED' CMakeLists.txt
          cp LICENSE.TXT ../src/main/assets/PPSSPP_LICENSE.txt
          test -s ../src/main/assets/PPSSPP_LICENSE.txt
          git rev-parse HEAD | grep -q "${PPSSPP_SHA}"

      - name: Patch PPSSPP normal flavor for embedded library
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path(
              "ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java"
          )
          text = source.read_text()
          old = 'return BuildConfig.FLAVOR.startsWith("vr");'
          new = 'return false; // RetroLink embeds the normal non-VR PPSSPP flavor.'

          if old in text:
              assert text.count(old) == 1, "Unexpected BuildConfig.FLAVOR reference count"
              text = text.replace(old, new, 1)
              source.write_text(text)
          else:
              assert new in text, "PPSSPP VR flavor guard not found"

          updated = source.read_text()
          assert new in updated
          assert "BuildConfig.FLAVOR" not in updated
          print("PPSSPP normal-flavor compatibility patch PASS")
          PY
          grep -Fq 'return false; // RetroLink embeds the normal non-VR PPSSPP flavor.' \
            ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java
          ! grep -Fq 'BuildConfig.FLAVOR' \
            ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java

      - name: Preflight PPSSPP Java compilation
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon --no-build-cache \
            :ppsspp-engine:compileDebugJavaWithJavac --stacktrace --info
          CLASS_FILE="$(find ppsspp-engine/build -type f \
            -path '*/org/ppsspp/ppsspp/PpssppActivity.class' -print -quit)"
          test -n "$CLASS_FILE"
          test -s "$CLASS_FILE"
          echo "PPSSPP Java preflight class: $CLASS_FILE"

      - name: Build pinned N64 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -s libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so \
             app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build pinned Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gambattecore
          git init gambattecore
          cd gambattecore
          git remote add origin https://github.com/libretro/gambatte-libretro.git
          git fetch --depth 1 origin "${GAMBATTE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libgambatte/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libgambatte/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
