              raise SystemExit("Unexpected RetroLink base version for Fusion Temporal")
          build.write_text(s)

          main_layout = Path("app/src/main/res/layout/activity_main.xml")
          if main_layout.is_file():
              s = main_layout.read_text()
              s = s.replace("v1.2.0 RC1", "v1.3.0 RC1")
              main_layout.write_text(s)

          print("v1.3.0 PS1 RetroSR Fusion Temporal applied")
          PY

      - name: Static PS1 validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          core = Path("app/src/main/java/cl/retrolink/app/CoreRegistry.java").read_text()
          repo = Path("app/src/main/java/cl/retrolink/app/Ps1RomRepository.java").read_text()
          bios = Path("app/src/main/java/cl/retrolink/app/Ps1BiosManager.java").read_text()
          library = Path("app/src/main/java/cl/retrolink/app/Ps1LibraryActivity.java").read_text()
          room = Path("app/src/main/java/cl/retrolink/app/Ps1RoomActivity.java").read_text()
          controller = Path("app/src/main/java/cl/retrolink/app/Ps1ControllerActivity.java").read_text()
          game = Path("app/src/main/java/cl/retrolink/app/Ps1GameActivity.java").read_text()
          bind = Path("app/src/main/java/cl/retrolink/app/Ps1ControlBinder.java").read_text()
          software = Path("app/src/main/java/cl/retrolink/app/SoftwareCoreView.java").read_text()
          gpu = Path("app/src/main/java/cl/retrolink/app/Ps1GpuCoreView.java").read_text()
          ps1_layout = Path("app/src/main/res/layout/activity_ps1_game.xml").read_text()
          notice = Path("app/src/main/assets/NOTICE_RETROSR_SGSR.txt").read_text()
          native = Path("app/src/main/cpp/retrolink_native.cpp").read_text()
          host_ble = Path("app/src/main/java/cl/retrolink/app/ble/HostBleManager.java").read_text()
          manifest = Path("app/src/main/AndroidManifest.xml").read_text()
          build = Path("app/build.gradle").read_text()

          assert '"ps1.pcsx_rearmed"' in core
          assert '"libretro_ps1.so"' in core
          assert '"chd|pbp|cue|iso|img|mdf|m3u"' in core

          assert 'Intent.EXTRA_ALLOW_MULTIPLE' in library
          assert 'Ps1RomRepository.importUris' in library
          assert 'CHD recomendado' in library
          assert 'Ps1BiosManager.importBios' in library
          assert 'BIOS_SIZE = 512L * 1024L' in bios
          assert 'n.endsWith(".chd")' in repo
          assert 'n.endsWith(".cue")' in repo
          assert 'n.endsWith(".bin")' in repo
          assert 'Files.readString(' not in repo
          assert 'Files.writeString(' not in repo
          assert 'Files.readAllBytes(' in repo
          assert 'Files.write(' in repo

          assert 'setSessionType("PS1")' in room
          assert 'setMaxPlayerNumber(2)' in room
          assert 'Ps1ControllerActivity.class' in room
          assert 'video.start(hostIp, 2, false)' in controller
          assert '"PS1".equals(sessionType)' in controller

          assert 'R.id.btnCross' in bind
          assert 'R.id.btnCircle' in bind
          assert 'R.id.btnSquare' in bind
          assert 'R.id.btnTriangle' in bind
          assert 'R.id.btnL2' in bind and 'R.id.btnR2' in bind

          assert 'configurePs1Defaults' in software
          assert 'pcsx_rearmed_memcard1' in software
          assert 'pcsx_rearmed_bios' in software
          assert 'pcsx_rearmed_neon_enhancement_enable", "enabled"' in software
          assert 'pcsx_rearmed_neon_enhancement_no_main", "disabled"' in software
          assert 'pcsx_rearmed_neon_enhancement_tex_adj_v2", "enabled"' in software
          assert 'pcsx_rearmed_frameskip_type", "disabled"' in software
          assert 'paint.setFilterBitmap(this.core == CoreRegistry.PS1)' in software
          assert 'core == CoreRegistry.PS1' in software

          assert 'class Ps1GpuCoreView extends GLSurfaceView' in gpu
          assert 'RETROSR_GSR_FRAGMENT' in gpu
          assert 'fastLanczos2' in gpu
          assert 'EDGE_THRESHOLD = 8.0 / 255.0' in gpu
          assert 'glTexSubImage2D' in gpu
          assert 'GL_RGBA8' in gpu
          assert 'FrameStreamServer.hasRemoteClients()' in gpu
          assert 'pcsx_rearmed_neon_enhancement_enable", "enabled"' in gpu
          assert 'SPATIAL FALLBACK' in gpu
          assert 'RETROSR_TEMPORAL_FRAGMENT' in gpu
          assert 'motion-compensated temporal pass' in gpu
          assert 'uSourcePrev' in gpu
          assert 'neighborhoodMin' in gpu
          assert 'historyWeight = 0.74' in gpu
          assert 'detectSceneCut' in gpu
          assert 'HIGH_QUALITY_SEARCH_PIXELS = 600_000' in gpu
          assert 'resolveTemporalSource' in gpu
          assert 'TEMPORAL HQ' in gpu
          assert 'two-pass order keeps the expensive temporal work at PS1 resolution' in gpu
          assert 'private final int[] historyTextures = new int[2];' in gpu
          assert 'historyWidth == width && historyHeight == height' in gpu
          assert 'outColor = vec4(clamp(resolved, vec3(0.0), vec3(1.0)).bgr, 1.0)' in gpu
          assert 'never adds a CPU readback' in gpu
          assert 'private Ps1GpuCoreView surface;' in game
          assert 'RETROSR FUSION TEMPORAL' in game
          assert '<cl.retrolink.app.Ps1GpuCoreView' in ps1_layout
          assert '<cl.retrolink.app.SoftwareCoreView' not in ps1_layout
          assert 'Qualcomm Innovation Center' in notice
          assert 'BSD-3-Clause' in notice
          assert 'info.need_fullpath' in native
          assert 'v1.0.2: no precargar el contenido antes de conocer need_fullpath' in native
          assert 'g_stage = "read rom";' not in native
          assert 'if (!info.need_fullpath)' in native
          assert 'game.data = info.need_fullpath ? nullptr : g_rom.data()' in native
          assert 'game.size = info.need_fullpath ? 0 : g_rom.size()' in native
          assert 'RETRO_DEVICE_ID_JOYPAD_R2' in native

          assert 'else if ("PS1".equals(value)) this.sessionType = "PS1";' in host_ble

          for cls in ("Ps1ControllerActivity","Ps1GameActivity","Ps1RoomActivity","Ps1LibraryActivity"):
              assert f'android:name=".{cls}"' in manifest

          assert 'versionCode 65' in build
          assert 'versionName "1.3.0-rc1"' in build

          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)
          ET.parse("app/src/main/AndroidManifest.xml")

          ids=set()
          for p in Path("app/src/main/res").rglob("*.xml"):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors="ignore")))

          refs=set()
          for name in (
              "Ps1LibraryActivity.java","Ps1RoomActivity.java",
              "Ps1ControllerActivity.java","Ps1GameActivity.java",
              "Ps1ControlBinder.java"):
              src=Path("app/src/main/java/cl/retrolink/app/"+name).read_text(errors="ignore")
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', src))
          missing=sorted(refs-ids)
          assert not missing, f"Missing PS1 R.id: {missing}"

          print("v1.3.0 PS1 RetroSR Fusion Temporal validation PASS")
          PY

      - name: Commit v1.3.0 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v1.3.0 source already committed."
          else
            git commit -m "feat(v1.3.0): add PS1 RetroSR Fusion temporal reconstruction"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Build pinned N64 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -s libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so \
             app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build pinned Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gambattecore
          git init gambattecore
          cd gambattecore
          git remote add origin https://github.com/libretro/gambatte-libretro.git
          git fetch --depth 1 origin "${GAMBATTE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libgambatte/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libgambatte/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_gambatte.so

      - name: Install Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          cp gambattecore/libgambatte/libretro/jni/libs/arm64-v8a/libretro_gambatte.so \
             app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so

      - name: Build pinned Snes9x core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf snes9xcore
          git init snes9xcore
          cd snes9xcore
          git remote add origin https://github.com/libretro/snes9x.git
          git fetch --depth 1 origin "${SNES9X_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_snes9x",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_snes9x.so

      - name: Install Snes9x core
        shell: bash
        run: |
          set -euxo pipefail
          cp snes9xcore/libretro/jni/libs/arm64-v8a/libretro_snes9x.so \
             app/src/main/jniLibs/arm64-v8a/libretro_snes9x.so

      - name: Build pinned Stella 2014 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf stellacore
          git init stellacore
          cd stellacore
          git remote add origin https://github.com/libretro/stella2014-libretro.git
          git fetch --depth 1 origin "${STELLA_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("jni/Android.mk")
          s=p.read_text()
          s2,n=re.subn(r'LOCAL_MODULE\s*:=\s*retro\b',
                       'LOCAL_MODULE       := retro_atari2600', s, count=1)
          assert n == 1
          p.write_text(s2)
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_atari2600.so

      - name: Install Stella core
        shell: bash
        run: |
          set -euxo pipefail
          cp stellacore/jni/libs/arm64-v8a/libretro_atari2600.so \
             app/src/main/jniLibs/arm64-v8a/libretro_atari2600.so

      - name: Fetch pinned PCSX-ReARMed
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf pcsxcore
          git init pcsxcore
          cd pcsxcore
          git remote add origin https://github.com/libretro/pcsx_rearmed.git
          git fetch --depth 1 origin "${PCSX_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${PCSX_SHA}"
          test -f jni/Android.mk
          test -f jni/Application.mk
          grep -F 'info->library_name     = "PCSX-ReARMed"' frontend/libretro.c
          grep -F 'info->need_fullpath    = true' frontend/libretro.c
          grep -F 'bin|cue|img|mdf|pbp|toc|cbn|m3u|chd|iso|exe' frontend/libretro.c

      - name: Build PCSX-ReARMed ARM64
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("pcsxcore/jni/Android.mk")
          s=p.read_text()
          s2,n=re.subn(r'LOCAL_MODULE\s*:=\s*retro\b',
                       'LOCAL_MODULE        := retro_ps1', s, count=1)
          assert n == 1
          p.write_text(s2)
          PY

          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd pcsxcore/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a

          test -s libs/arm64-v8a/libretro_ps1.so
          strings libs/arm64-v8a/libretro_ps1.so > "$RUNNER_TEMP/pcsx.strings"
          grep -qi 'PCSX-ReARMed' "$RUNNER_TEMP/pcsx.strings"
          grep -q 'pcsx_rearmed_neon_enhancement_enable' "$RUNNER_TEMP/pcsx.strings"

      - name: Install PCSX-ReARMed core
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp pcsxcore/jni/libs/arm64-v8a/libretro_ps1.so \
             app/src/main/jniLibs/arm64-v8a/libretro_ps1.so
          test -s app/src/main/jniLibs/arm64-v8a/libretro_ps1.so

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_snes9x.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_atari2600.so'
