        export PAYLOAD
        python3 - <<'PY_HUB_EXTRACT'
        from pathlib import Path, PurePosixPath
        import hashlib, json, os, stat, zipfile
        archive_path=Path(os.environ['PAYLOAD'])
        assert hashlib.sha256(archive_path.read_bytes()).hexdigest() == "b90d0eee2d51a709494840e8750a9d850d7a086d603472480ec690d08cc185ef", 'Source payload checksum mismatch'
        root=Path.cwd().resolve()
        with zipfile.ZipFile(archive_path) as archive:
            assert archive.testzip() is None
            names=archive.namelist()
            assert len(names)==len(set(names)), 'Duplicate archive entries'
            manifest=json.loads(archive.read('SOURCE_MANIFEST.json'))
            assert manifest['base_commit']==os.environ['BASE_SHA']
            assert set(names)==set(manifest['files'])|{'SOURCE_MANIFEST.json'}
            for info in archive.infolist():
                relative=PurePosixPath(info.filename)
                assert not relative.is_absolute() and '..' not in relative.parts and '\\' not in info.filename
                assert not stat.S_ISLNK(info.external_attr>>16), 'Symlink forbidden'
                target=(root/relative).resolve()
                assert target.is_relative_to(root) and not target.exists(), f'Refusing to overwrite baseline: {relative}'
                content=archive.read(info)
                if info.filename!='SOURCE_MANIFEST.json':
                    assert hashlib.sha256(content).hexdigest()==manifest['files'][info.filename]
            for info in archive.infolist():
                target=root/info.filename
                target.parent.mkdir(parents=True,exist_ok=True)
                target.write_bytes(archive.read(info))
        print('Verified and extracted new sources only; no .b64 file placed in Android resources.')
        PY_HUB_EXTRACT
        python3 tools/apply_hub.py
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Set up Gradle 9.4.1
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.4.1
    - name: Run actual JVM tests and Java syntax checks
      shell: bash
      run: |
        set -euo pipefail
        TEST_CLASSES="$RUNNER_TEMP/hub-jvm"
        mkdir -p "$TEST_CLASSES"
        javac --release 17 -d "$TEST_CLASSES"       app/src/main/java/cl/retrolink/app/HubGame.java tests/HubGameTest.java tools/CheckJavaSyntax.java
        java -cp "$TEST_CLASSES" cl.retrolink.app.HubGameTest | tee "$RUNNER_TEMP/hub-reports/jvm-tests.txt"
        java -cp "$TEST_CLASSES" CheckJavaSyntax       app/src/main/java/cl/retrolink/app/HubGame.java       app/src/main/java/cl/retrolink/app/HubStore.java       app/src/main/java/cl/retrolink/app/HubCatalog.java       app/src/main/java/cl/retrolink/app/HubCoverLoader.java       app/src/main/java/cl/retrolink/app/RetroHubActivity.java       | tee "$RUNNER_TEMP/hub-reports/java-syntax.txt"
    - name: Verify unchanged engines inputs saves and source routes
      shell: bash
      run: |
        set -euo pipefail
        python3 tools/validate_hub.py | tee "$RUNNER_TEMP/hub-reports/baseline-integrity.txt"
    - name: Install Android SDK NDK CMake with validated retries
      shell: bash
      run: |
        set -euxo pipefail
        SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
        test -x "$SDKMANAGER"
        yes | "$SDKMANAGER" --licenses >/dev/null || true

        clean_sdk_download_state() {
          rm -rf "${ANDROID_SDK_ROOT}/.temp" "${HOME}/.android/cache" || true
          mkdir -p "${HOME}/.android"
        }

        install_with_retry() {
          local package="$1"
          local marker="$2"
          local target_dir="${3:-}"
          if test -e "$marker"; then
            echo "Reusing installed SDK package: $package"
            return 0
          fi
          for attempt in 1 2 3; do
            echo "Installing $package (attempt ${attempt}/3)"
            clean_sdk_download_state
            if test -n "$target_dir"; then
              rm -rf "$target_dir" || true
            fi
            if "$SDKMANAGER" --sdk_root="${ANDROID_SDK_ROOT}" "$package"; then
              if test -e "$marker"; then
                echo "Validated SDK package: $package"
                return 0
              fi
            fi
            sleep $((attempt * 5))
          done
          return 1
        }

        install_with_retry           "platform-tools"           "${ANDROID_SDK_ROOT}/platform-tools/adb"
        install_with_retry           "platforms;android-36"           "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"           "${ANDROID_SDK_ROOT}/platforms/android-36"
        install_with_retry           "build-tools;36.0.0"           "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"           "${ANDROID_SDK_ROOT}/build-tools/36.0.0"
        install_with_retry           "cmake;3.22.1"           "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake"           "${ANDROID_SDK_ROOT}/cmake/3.22.1"

        NDK_DIR="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        if ! install_with_retry             "ndk;${NDK_VERSION}"             "${NDK_DIR}/source.properties"             "${NDK_DIR}"; then
          echo "sdkmanager NDK download remained invalid; using the official r28c archive fallback."
          clean_sdk_download_state
          rm -rf "$NDK_DIR"
          mkdir -p "${ANDROID_SDK_ROOT}/ndk"
          TMP_NDK="$(mktemp -d)"
          trap 'rm -rf "$TMP_NDK"' EXIT
          curl --fail --location             --retry 5 --retry-delay 5 --retry-all-errors             --output "${TMP_NDK}/android-ndk-r28c-linux.zip"             "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          unzip -tq "${TMP_NDK}/android-ndk-r28c-linux.zip"
          unzip -q "${TMP_NDK}/android-ndk-r28c-linux.zip" -d "$TMP_NDK"
          test -f "${TMP_NDK}/android-ndk-r28c/source.properties"
          mv "${TMP_NDK}/android-ndk-r28c" "$NDK_DIR"
        fi

        test -f "${NDK_DIR}/source.properties"
        test -x "${NDK_DIR}/ndk-build"
        grep -q "Pkg.Revision = ${NDK_VERSION}" "${NDK_DIR}/source.properties"
        "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake" --version
        "${NDK_DIR}/ndk-build" --version
    - name: Validate Android toolchain before native builds
      shell: bash
      run: |
        set -euxo pipefail
        test -f "${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
        test -x "${ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
        test -x "${ANDROID_SDK_ROOT}/cmake/3.22.1/bin/cmake"
        test -f "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/source.properties"
        test -x "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/ndk-build"
        grep -q "Pkg.Revision = ${NDK_VERSION}"           "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/source.properties"
        echo "Android SDK/NDK/CMake toolchain validation PASS"
    - name: Configure optional existing debug signing key
      shell: bash
      run: |
        set -euo pipefail
        # Never enable shell tracing in this step. Never upload this directory.
        if [ -n "${RETROLINK_DEBUG_KEYSTORE_BASE64:-}" ]; then
          umask 077
          mkdir -p "$HOME/.android"
          python3 - <<'PY_KEY'
        import base64, os
        from pathlib import Path
        path=Path.home()/'.android/debug.keystore'
        raw=base64.b64decode(''.join(os.environ['RETROLINK_DEBUG_KEYSTORE_BASE64'].split()),validate=True)
        if not raw or len(raw)>1048576: raise SystemExit('Invalid keystore payload size')
        path.write_bytes(raw)
        path.chmod(0o600)
        PY_KEY
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "An existing debug keystore was supplied; certificate continuity will be checked on the built APK."
        else
          echo "::warning::No existing signing key supplied. Build may use a different debug certificate; do not uninstall your existing app."
        fi
      env:
        RETROLINK_DEBUG_KEYSTORE_BASE64: ${{ secrets.RETROLINK_DEBUG_KEYSTORE_BASE64 }}
    - name: Fetch pinned PPSSPP 1.20.4
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf ppsspp-engine/upstream
        git init ppsspp-engine/upstream
        cd ppsspp-engine/upstream
        git remote add origin https://github.com/hrydgard/ppsspp.git
        git fetch --depth 1 origin "${PPSSPP_SHA}"
        git checkout --detach FETCH_HEAD
        git submodule sync --recursive
        git submodule update --init --recursive --depth 1 || git submodule update --init --recursive
        test -f CMakeLists.txt
        test -f android/src/org/ppsspp/ppsspp/PpssppActivity.java
        test -f android/src/main/proto/tombstone.proto
        test -d assets
        grep -q 'add_library(ppsspp_jni SHARED' CMakeLists.txt
        cp LICENSE.TXT ../src/main/assets/PPSSPP_LICENSE.txt
        test -s ../src/main/assets/PPSSPP_LICENSE.txt
        git rev-parse HEAD | grep -q "${PPSSPP_SHA}"
    - name: Patch PPSSPP normal flavor and proxy theme resources
      shell: bash
      run: |
        set -euxo pipefail
        python3 - <<'PY'
        from pathlib import Path

        source = Path(
            "ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java"
        )
        text = source.read_text()
        old = 'return BuildConfig.FLAVOR.startsWith("vr");'
        new = 'return false; // RetroLink embeds the normal non-VR PPSSPP flavor.'

        if old in text:
            assert text.count(old) == 1, "Unexpected BuildConfig.FLAVOR reference count"
            text = text.replace(old, new, 1)
            source.write_text(text)
        else:
            assert new in text, "PPSSPP VR flavor guard not found"

        updated = source.read_text()
        assert new in updated
        assert "BuildConfig.FLAVOR" not in updated

        engine = Path("ppsspp-engine/build.gradle")
        engine_text = engine.read_text()
        required_res = 'file("${upstreamDir}/android/src/main/res")'
        assert required_res in engine_text, "PPSSPP default Android resources are not configured"

        theme = Path(
            "ppsspp-engine/upstream/android/src/main/res/values/themes.xml"
        )
        assert theme.is_file() and theme.stat().st_size > 0, theme
        assert '<style name="Theme.ProxyTransparent"' in theme.read_text()
        print("PPSSPP normal-flavor and proxy-theme resource patch PASS")
        PY
        grep -Fq 'return false; // RetroLink embeds the normal non-VR PPSSPP flavor.' \
          ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java
        ! grep -Fq 'BuildConfig.FLAVOR' \
          ppsspp-engine/upstream/android/src/org/ppsspp/ppsspp/PpssppActivity.java
        grep -Fq 'file("${upstreamDir}/android/src/main/res")' \
          ppsspp-engine/build.gradle
        grep -Fq '<style name="Theme.ProxyTransparent"' \
          ppsspp-engine/upstream/android/src/main/res/values/themes.xml
    - name: Preflight PPSSPP Java compilation
      shell: bash
      run: |
        set -euxo pipefail
        gradle --no-daemon --no-build-cache \
          :ppsspp-engine:compileDebugJavaWithJavac --stacktrace --info
        CLASS_FILE="$(find ppsspp-engine/build -type f \
          -path '*/org/ppsspp/ppsspp/PpssppActivity.class' -print -quit)"
        test -n "$CLASS_FILE"
        test -s "$CLASS_FILE"
        echo "PPSSPP Java preflight class: $CLASS_FILE"
    - name: Preflight PPSSPP manifest and app resource linking
      shell: bash
      run: |
        set -euxo pipefail
        THEME_FILE="ppsspp-engine/upstream/android/src/main/res/values/themes.xml"
        test -s "$THEME_FILE"
        grep -Fq '<style name="Theme.ProxyTransparent"' "$THEME_FILE"
        grep -Fq 'file("${upstreamDir}/android/src/main/res")' \
          ppsspp-engine/build.gradle
        gradle --no-daemon --no-build-cache \
          :ppsspp-engine:processDebugManifest \
          :app:processDebugResources \
          --stacktrace --info
        MERGED_MANIFEST="ppsspp-engine/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml"
        test -s "$MERGED_MANIFEST"
        grep -Fq '@style/Theme.ProxyTransparent' "$MERGED_MANIFEST"
        echo "PPSSPP proxy-theme resource linking preflight PASS"
    - name: Preflight complete Android Java including new UI
      shell: bash
      run: |
        set -euxo pipefail
        gradle --no-daemon --no-build-cache \
          :app:compileDebugJavaWithJavac --stacktrace --info
        CLASS_FILE="$(find app/build -type f \
          -path '*/cl/retrolink/app/AdaptiveRuntimeSession.class' -print -quit)"
        test -n "$CLASS_FILE"
        test -s "$CLASS_FILE"
        echo "RetroLink application Java preflight PASS: $CLASS_FILE"
        for CLASS in RetroHubActivity HubCatalog HubGame HubStore HubCoverLoader; do
          CLASS_FILE="$(find app/build -type f -path "*/cl/retrolink/app/${CLASS}.class" -print -quit)"
          test -n "$CLASS_FILE"
          test -s "$CLASS_FILE"
        done
        echo "Android Java compilation: new UI plus existing application PASS" | tee "$RUNNER_TEMP/hub-reports/android-java.txt"
    - name: Save UI source on independent branch without overwriting changes
      shell: bash
      run: |
        set -euo pipefail
        # Explicit files only. No engines, binaries, SDK files, secrets, or caches are staged.
        python3 - <<'PY_STAGE'
        import json, subprocess
        from pathlib import Path
        names=list(json.loads(Path('SOURCE_MANIFEST.json').read_text())['files'])
        names+=['SOURCE_MANIFEST.json','app/build.gradle','app/src/main/AndroidManifest.xml']
        subprocess.run(['git','add','--',*names],check=True)
        PY_STAGE
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git commit -m "feat(ui): add v1.6 unified library hub [skip ci]"
        if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH_NAME" >/dev/null 2>&1; then
          git fetch origin "refs/heads/$BRANCH_NAME"
          if [ "$(git rev-parse 'HEAD^{tree}')" != "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "::error::Destination branch has a different source tree. No force push or overwrite was attempted."
            exit 1
          fi
          echo "Destination branch already contains this exact source tree."
        else
          git push origin "HEAD:refs/heads/$BRANCH_NAME"
        fi
        printf '%s\n' "$(git rev-parse HEAD)" > "$RUNNER_TEMP/hub-reports/build-source-commit.txt"
        git ls-remote --heads origin "refs/heads/$BRANCH_NAME" > "$RUNNER_TEMP/hub-reports/branch-source-ref.txt"
    - name: Build pinned N64 core
      shell: bash
      run: |
        set -euxo pipefail
        rm -rf n64core
        git init n64core
        cd n64core
        git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
        git fetch --depth 1 origin "${N64_CORE_SHA}"
        git checkout --detach FETCH_HEAD
        python3 - <<'PY'
        from pathlib import Path
        p=Path("libretro/jni/Android.mk")
        s=p.read_text()
        old="LOCAL_MODULE           := retro"
        assert old in s
        p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
        PY
        export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
        cd libretro/jni
        "${NDK_ROOT}/ndk-build" -j2 \
          NDK_PROJECT_PATH=. \
          NDK_APPLICATION_MK=Application.mk \
          APP_BUILD_SCRIPT=Android.mk \
          APP_ABI=arm64-v8a \
          GLES3=1
        test -s libs/arm64-v8a/libretro_n64.so
    - name: Install N64 core and libretro ABI
      shell: bash
      run: |
        set -euxo pipefail
        mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
        cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so \
           app/src/main/jniLibs/arm64-v8a/libretro_n64.so
        cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h
    - name: Build pinned Gambatte core
