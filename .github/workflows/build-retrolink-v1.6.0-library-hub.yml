jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout exact compiled v1.5 source
      uses: actions/checkout@v4
      with:
        ref: 9379168238fbc3d78fc284744536c95a0ef88718
        fetch-depth: 0
    - name: Verify pinned source and independent destination
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "$BASE_SHA"
        test "$BRANCH_NAME" = "codex/v1.6-library-hub"
        test "$BRANCH_NAME" != "main"
        mkdir -p "$RUNNER_TEMP/hub-reports"
        git status --porcelain
        test -z "$(git status --porcelain)"
        echo "UI increment starts at an exact v1.5 commit; no emulator reintegration."
