      - name: Build debug APK
        working-directory: retrolink
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp retrolink/app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.1-debug.apk
          ls -lh RetroLink-v0.1-debug.apk

      - name: Upload RetroLink APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.1-debug
          path: RetroLink-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 14
