      - name: Static v0.9.1 multiplayer validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          host = Path("app/src/main/java/cl/retrolink/app/ble/HostBleManager.java").read_text()
          ctl = Path("app/src/main/java/cl/retrolink/app/ble/ControllerBleManager.java").read_text()
          atari = Path("app/src/main/java/cl/retrolink/app/Atari2600ControllerActivity.java").read_text()
          build = Path("app/build.gradle").read_text()

          assert 'Arrays.copyOfRange(full, offset, full.length)' in host
          assert 'BluetoothGatt.GATT_INVALID_OFFSET' in host
          assert 'gattServer.sendResponse(device, requestId, BluetoothGatt.GATT_SUCCESS, offset, value)' in host
          assert '"ATARI2600".equals(activeSessionType)' in ctl
          assert 'BluetoothGattCharacteristic.WRITE_TYPE_DEFAULT' in ctl
          assert 'inputWriteWatchdog' in ctl
          assert 'extractIpv4' in ctl
          assert 'activeSessionType = sessionType' in ctl
          assert 'video.start(hostIp, 2, false)' in atari
          assert 'versionCode 51' in build
          assert 'versionName "0.9.1-rc1"' in build

          ET.parse("app/src/main/AndroidManifest.xml")
          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)

          print("v0.9.1 Atari multiplayer validation PASS")
          PY

      - name: Commit v0.9.1 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v0.9.1 source already committed."
          else
            git commit -m "fix(v0.9.1): repair Atari 2600 BLE host info and P2 input"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Build pinned N64 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -s libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so \
             app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build pinned Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gambattecore
          git init gambattecore
          cd gambattecore
          git remote add origin https://github.com/libretro/gambatte-libretro.git
          git fetch --depth 1 origin "${GAMBATTE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GAMBATTE_SHA}"
          grep -q 'HAVE_NETWORK := 1' libgambatte/libretro/jni/Android.mk
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libgambatte/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libgambatte/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_gambatte.so

      - name: Install Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          cp gambattecore/libgambatte/libretro/jni/libs/arm64-v8a/libretro_gambatte.so \
             app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so

      - name: Build pinned Snes9x core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf snes9xcore
          git init snes9xcore
          cd snes9xcore
          git remote add origin https://github.com/libretro/snes9x.git
          git fetch --depth 1 origin "${SNES9X_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SNES9X_SHA}"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_snes9x",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_snes9x.so

      - name: Install Snes9x core
        shell: bash
        run: |
          set -euxo pipefail
          cp snes9xcore/libretro/jni/libs/arm64-v8a/libretro_snes9x.so \
             app/src/main/jniLibs/arm64-v8a/libretro_snes9x.so

      - name: Fetch pinned Stella 2014
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf stellacore
          git init stellacore
          cd stellacore
          git remote add origin https://github.com/libretro/stella2014-libretro.git
          git fetch --depth 1 origin "${STELLA_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${STELLA_SHA}"
          test -f jni/Android.mk
          test -f jni/Application.mk
          grep -F 'valid_extensions = "a26|bin|mvc"' libretro.cxx

      - name: Build Stella 2014 ARM64
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path("stellacore/jni/Android.mk")
          s=p.read_text()
          s2,n=re.subn(r'LOCAL_MODULE\s*:=\s*retro\b',
                       'LOCAL_MODULE       := retro_atari2600',
                       s, count=1)
          assert n == 1
          p.write_text(s2)
          PY

          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd stellacore/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a

          test -s libs/arm64-v8a/libretro_atari2600.so
          strings libs/arm64-v8a/libretro_atari2600.so > "$RUNNER_TEMP/stella.strings"
          grep -qi 'stella' "$RUNNER_TEMP/stella.strings"

      - name: Install Stella core
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp stellacore/jni/libs/arm64-v8a/libretro_atari2600.so \
             app/src/main/jniLibs/arm64-v8a/libretro_atari2600.so
          test -s app/src/main/jniLibs/arm64-v8a/libretro_atari2600.so

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_snes9x.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_atari2600.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          grep -q 'versionName "0.9.1-rc1"' app/build.gradle
          grep -q 'setSessionType("ATARI2600")' \
             app/src/main/java/cl/retrolink/app/Atari2600RoomActivity.java
          grep -q 'video.start(hostIp, 2, false)' \
             app/src/main/java/cl/retrolink/app/Atari2600ControllerActivity.java
          grep -q 'Arrays.copyOfRange(full, offset, full.length)' \
             app/src/main/java/cl/retrolink/app/ble/HostBleManager.java
          grep -q 'WRITE_TYPE_DEFAULT' \
             app/src/main/java/cl/retrolink/app/ble/ControllerBleManager.java

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk \
             RetroLink-v0.9.1-atari2600-multiplayer-fix-rc1-debug.apk
          sha256sum RetroLink-v0.9.1-atari2600-multiplayer-fix-rc1-debug.apk \
            | tee RetroLink-v0.9.1-atari2600-multiplayer-fix-rc1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.9.1-atari2600-multiplayer-fix-rc1
          path: |
            RetroLink-v0.9.1-atari2600-multiplayer-fix-rc1-debug.apk
            RetroLink-v0.9.1-atari2600-multiplayer-fix-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14
