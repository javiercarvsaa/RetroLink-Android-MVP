      - name: Functional UI static validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          root = Path('.')
          for p in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('app/src/main/AndroidManifest.xml')
          ids=set()
          for p in Path('app/src/main/res/layout').glob('*.xml'):
              ids.update(re.findall(r'android:id="@\+id/([A-Za-z0-9_]+)"', p.read_text()))
          missing=[]
          for p in Path('app/src/main/java').rglob('*.java'):
              for rid in re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text()):
                  if rid not in ids: missing.append((rid, str(p)))
          assert not missing, missing[:20]
          layouts='\n'.join(p.read_text() for p in Path('app/src/main/res/layout').glob('*.xml'))
          assert 'RL7K3' not in layouts
          assert 'btnLibraryFavorite' not in layouts
          assert 'Buscar juegos' not in layouts
          host=Path('app/src/main/res/layout/activity_host.xml').read_text()
          assert 'btnViewMode' not in host
          lib=Path('app/src/main/java/cl/retrolink/app/LibraryActivity.java').read_text()
          assert 'N64RomRepository.importRom' in lib
          settings=Path('app/src/main/java/cl/retrolink/app/SettingsActivity.java').read_text()
          for token in ['setStreamFps', 'setStreamQuality', 'resetUserSettings', 'AndroidGamepadMapper.connectedGamepadsSummary']:
              assert token in settings
          cpp=Path('app/src/main/cpp/retrolink_native.cpp').read_text()
          assert 'return axis_to_libretro(in.y)' in cpp
          assert '-axis_to_libretro(in.y)' not in cpp
          print('Functional UI static checks PASS')
          PY2

      - name: Commit v0.6.2 Functional UI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app docs README.md TEST_CHECKLIST.md
          if git diff --cached --quiet; then
            echo "Functional UI already applied."
          else
            git commit -m "feat(ui): ship v0.6.2 functional menu cleanup"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Update or open draft pull request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh pr view "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "RetroLink v0.6.2 — Functional UI & Menu Cleanup"
          else
            gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base main \
              --head "${BRANCH_NAME}" \
              --draft \
              --title "RetroLink v0.6.2 — Functional UI & Menu Cleanup" \
              --body "Depura Inicio, Biblioteca, Sala, Ajustes y Perfil para que cada control visible tenga una función real. Elimina placeholders de favoritos/búsqueda/plataformas no integradas/código de sala, centraliza la ROM N64, añade FPS/calidad de streaming reales y mantiene Input Foundation, PresentSync y el icono oficial."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('n64core/libretro/jni/Android.mk')
          s = p.read_text()
          old = 'LOCAL_MODULE           := retro'
          assert old in s, 'LOCAL_MODULE retro not found'
          p.write_text(s.replace(old, 'LOCAL_MODULE           := retro_n64', 1))
          PY2

      - name: Build integrated N64 core for ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build" \
            -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build RetroLink v0.6.2 RC1 APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          grep -q 'versionName "0.6.2-rc1"' app/build.gradle
          grep -q 'android:icon="@mipmap/ic_launcher"' app/src/main/AndroidManifest.xml
          grep -q 'N64RomRepository' app/src/main/java/cl/retrolink/app/LibraryActivity.java

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.6.2-functional-ui-rc1-debug.apk
          sha256sum RetroLink-v0.6.2-functional-ui-rc1-debug.apk | tee RetroLink-v0.6.2-functional-ui-rc1-debug.sha256

      - name: Upload RetroLink v0.6.2 Functional UI RC1
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.6.2-functional-ui-rc1
          path: |
            RetroLink-v0.6.2-functional-ui-rc1-debug.apk
            RetroLink-v0.6.2-functional-ui-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RetroLink v0.6.2 Functional UI RC1"
            echo ""
            echo "- UI: Inicio/Biblioteca/Sala/Ajustes/Perfil depurados"
            echo "- Regla: sin controles o estados simulados"
            echo "- Biblioteca: N64 únicamente mientras sea el único core integrado"
            echo "- Sala: sin código ficticio; IP/puerto/clientes reales"
            echo "- Ajustes: stream FPS/Q directos, input real, reset funcional"
            echo "- N64: PresentSync + Input Foundation preservados"
            echo "- Manual validation: navegación, ROM picker, Sala P1-P4, Settings, Smash Bros, DK64, Mario Kart"
          } >> "$GITHUB_STEP_SUMMARY"
