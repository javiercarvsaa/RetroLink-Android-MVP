      - name: Static cover and layout validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          for p in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('app/src/main/AndroidManifest.xml')

          ids=set()
          for p in Path('app/src/main/res').rglob('*.xml'):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          refs=set()
          for p in Path('app/src/main/java').rglob('*.java'):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          missing=sorted(refs-ids)
          assert not missing, f'Missing R.id: {missing}'

          cover=Path('app/src/main/java/cl/retrolink/app/CoverArtManager.java').read_text()
          for token in ['thumbnails.libretro.com', 'Named_Boxarts', 'INDEX_TTL_MS', 'bestScore >= 0.55d']:
              assert token in cover, token
          library=Path('app/src/main/java/cl/retrolink/app/LibraryActivity.java').read_text()
          assert 'CoverArtManager.request' in library
          assert 'btnLibraryRefreshCovers' in library
          repo=Path('app/src/main/java/cl/retrolink/app/N64RomRepository.java').read_text()
          assert 'OpenableColumns.DISPLAY_NAME' in repo
          gamepad=Path('app/src/main/java/cl/retrolink/app/AndroidGamepadMapper.java').read_text()
          assert 'd.isVirtual()' in gamepad and 'isPhysicalGamepad' in gamepad
          host=Path('app/src/main/res/layout/activity_host.xml').read_text()
          for bid in ['btnPlayers1','btnPlayers2','btnPlayers3','btnPlayers4']:
              m=re.search(r'<Button[^>]*android:id="@\+id/'+bid+r'"[^>]*>', host)
              assert m, bid
              assert 'android:layout_width="0dp"' in m.group(0), bid
              assert 'android:minWidth="0dp"' in m.group(0), bid
          print('v0.6.4 static checks PASS')
          PY2

      - name: Commit v0.6.4 cover search
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md TEST_CHECKLIST.md docs
          if git diff --cached --quiet; then
            echo "v0.6.4 source already present."
          else
            git commit -m "feat(v0.6.4): automatic N64 cover search and UI polish"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Update or open draft pull request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh pr view "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Draft PR already exists."
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH_NAME}" --draft \
              --title "RetroLink v0.6.4 — Automatic Cover Search" \
              --body "Carátulas N64 automáticas con caché local, fix responsive 1P–4P, perfil simplificado y filtro de gamepads virtuales. Validación física pendiente."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro/jni/Application.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          import re
          p='n64core/libretro/jni/Android.mk'
          s=open(p, encoding='utf-8').read()
          s2, n = re.subn(r'(?m)^(LOCAL_MODULE\s*:=\s*)retro\s*$', r'\1retro_n64', s, count=1)
          if n != 1:
              raise SystemExit('No se encontró exactamente un LOCAL_MODULE retro para renombrar')
          open(p,'w',encoding='utf-8').write(s2)
          PY2
          grep -Eq '^[[:space:]]*LOCAL_MODULE[[:space:]]*:=[[:space:]]*retro_n64[[:space:]]*$' n64core/libretro/jni/Android.mk

      - name: Build integrated N64 core for ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build" \
            -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build RetroLink v0.6.4 RC1 APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          grep -q 'versionName "0.6.4-rc1"' app/build.gradle
          grep -q 'android.permission.INTERNET' app/src/main/AndroidManifest.xml
          grep -q 'CoverArtManager' app/src/main/java/cl/retrolink/app/LibraryActivity.java

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.6.4-cover-search-rc1-debug.apk
          sha256sum RetroLink-v0.6.4-cover-search-rc1-debug.apk | tee RetroLink-v0.6.4-cover-search-rc1-debug.sha256

      - name: Upload RetroLink v0.6.4 Cover Search RC1
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.6.4-cover-search-rc1
          path: |
            RetroLink-v0.6.4-cover-search-rc1-debug.apk
            RetroLink-v0.6.4-cover-search-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RetroLink v0.6.4 RC1"
            echo ""
            echo "- Automatic N64 cover search: Libretro Thumbnails"
            echo "- Cover cache: local; index TTL: 7 days"
            echo "- Player selector 1P-4P: responsive"
            echo "- Profile: simplified device info"
            echo "- Physical gamepad summary ignores Android virtual devices"
            echo "- APK artifact: RetroLink-v0.6.4-cover-search-rc1"
            echo "- Physical validation pending: cover accuracy, offline fallback, 1P-4P selector, regression N64"
          } >> "$GITHUB_STEP_SUMMARY"
