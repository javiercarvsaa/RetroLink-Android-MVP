      - name: Apply v1.0.1 Android Java compatibility fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/java/cl/retrolink/app/Ps1RomRepository.java")
          s = p.read_text()

          old_read = 'String name = Files.readString(marker.toPath(), StandardCharsets.UTF_8).trim();'
          new_read = 'String name = new String(Files.readAllBytes(marker.toPath()), StandardCharsets.UTF_8).trim();'
          if old_read in s:
              s = s.replace(old_read, new_read, 1)
          elif new_read not in s:
              raise SystemExit("Ps1RomRepository read marker not found")

          old_write = 'Files.writeString(new File(folder, LAUNCH_FILE).toPath(),\n                    primary.name, StandardCharsets.UTF_8);'
          new_write = 'Files.write(new File(folder, LAUNCH_FILE).toPath(),\n                    primary.name.getBytes(StandardCharsets.UTF_8));'
          if old_write in s:
              s = s.replace(old_write, new_write, 1)
          elif new_write not in s:
              raise SystemExit("Ps1RomRepository write marker not found")

          p.write_text(s)

          p = Path("app/build.gradle")
          s = p.read_text()
          if 'versionName "1.0.0-rc1"' in s:
              s = s.replace("versionCode 60", "versionCode 61", 1)
              s = s.replace('versionName "1.0.0-rc1"', 'versionName "1.0.1-rc1"', 1)
          elif ('versionName "1.0.1-rc1"' not in s
                and 'versionName "1.0.2-rc1"' not in s
                and 'versionName "1.1.0-rc1"' not in s
                and 'versionName "1.2.0-rc1"' not in s
                and 'versionName "1.3.0-rc1"' not in s
                and 'versionName "1.4.0-rc1"' not in s):
              raise SystemExit("Unexpected RetroLink base version")
          p.write_text(s)

          layout = Path("app/src/main/res/layout/activity_main.xml")
          if layout.is_file():
              text = layout.read_text()
              text = text.replace("v1.0.0 RC1", "v1.0.1 RC1")
              layout.write_text(text)

          print("v1.0.1 Android Java compatibility fix applied")
          PY

      - name: Apply v1.0.2 PS1 fullpath runtime fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/src/main/cpp/retrolink_native.cpp")
          s = p.read_text()

          marker_start = '    g_stage = "read rom";'
          marker_end = '    g_stage = "bind callbacks";'
          already = 'v1.0.2: no precargar el contenido antes de conocer need_fullpath'

          if already not in s:
              a = s.find(marker_start)
              b = s.find(marker_end, a + 1)
              if a < 0 or b < 0 or b <= a:
                  raise SystemExit("PS1 fullpath markers not found")
              replacement = (
                  '    // v1.0.2: no precargar el contenido antes de conocer need_fullpath.\n'
                  '    // PCSX-ReARMed usa directamente game.path cuando need_fullpath=true.\n'
                  '    g_rom.clear();\n\n'
              )
              s = s[:a] + replacement + s[b:]

          required = [
              'if (!info.need_fullpath)',
              'game.path = rom.c_str();',
              'game.data = info.need_fullpath ? nullptr : g_rom.data();',
              'game.size = info.need_fullpath ? 0 : g_rom.size();',
          ]
          for item in required:
              if item not in s:
                  raise SystemExit("Missing native fullpath invariant: " + item)

          if marker_start in s:
              raise SystemExit("Obsolete pre-read block is still present")

          p.write_text(s)

          p = Path("app/build.gradle")
          s = p.read_text()
          if 'versionName "1.0.1-rc1"' in s:
              s = s.replace("versionCode 61", "versionCode 62", 1)
              s = s.replace('versionName "1.0.1-rc1"', 'versionName "1.0.2-rc1"', 1)
          elif ('versionName "1.0.2-rc1"' not in s
                and 'versionName "1.1.0-rc1"' not in s
                and 'versionName "1.2.0-rc1"' not in s
                and 'versionName "1.3.0-rc1"' not in s
                and 'versionName "1.4.0-rc1"' not in s):
              raise SystemExit("Unexpected RetroLink base version")
          p.write_text(s)

          layout = Path("app/src/main/res/layout/activity_main.xml")
          if layout.is_file():
              s = layout.read_text()
              s = s.replace("v1.0.1 RC1", "v1.0.2 RC1")
              layout.write_text(s)

          print("v1.0.2 PS1 fullpath runtime fix applied")
          PY

      - name: Apply v1.1.0 PS1 RetroSR 2X graphics
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # 1) Enable PCSX-ReARMed NEON enhanced-resolution path.
          p = Path("app/src/main/java/cl/retrolink/app/SoftwareCoreView.java")
          s = p.read_text()

          anchor = '        NativeLibretro.nativeSetFrontendOption("pcsx_rearmed_drc", "enabled");'
          extras = '''        NativeLibretro.nativeSetFrontendOption("pcsx_rearmed_neon_enhancement_enable", "enabled");
          NativeLibretro.nativeSetFrontendOption("pcsx_rearmed_neon_enhancement_no_main", "disabled");
          NativeLibretro.nativeSetFrontendOption("pcsx_rearmed_neon_enhancement_tex_adj_v2", "enabled");'''

          if 'pcsx_rearmed_neon_enhancement_enable' not in s:
              if anchor not in s:
                  raise SystemExit("PCSX DRC option anchor not found")
              s = s.replace(anchor, anchor + "\n" + extras, 1)

          # Quality-first: don't sacrifice frames unless we later add an adaptive profile.
          s = s.replace(
              'NativeLibretro.nativeSetFrontendOption("pcsx_rearmed_frameskip_type", "auto");',
              'NativeLibretro.nativeSetFrontendOption("pcsx_rearmed_frameskip_type", "disabled");',
              1
          )

          # Filter only the PS1 presentation layer; leave pixel-art systems untouched.
          filter_line = '        paint.setFilterBitmap(this.core == CoreRegistry.PS1);'
          core_line = '        this.core = core == null ? CoreRegistry.GAME_BOY : core;'
          if filter_line not in s:
              if core_line not in s:
                  raise SystemExit("SoftwareCoreView core assignment anchor not found")
              s = s.replace(core_line, core_line + "\n" + filter_line, 1)

          p.write_text(s)

          # 2) Make the active graphics mode visible while testing.
          p = Path("app/src/main/java/cl/retrolink/app/Ps1GameActivity.java")
          s = p.read_text()
          s = s.replace(
              '"PCSX-ReARMed · P1 HOST · preparando P2…"',
              '"PCSX-ReARMed · RETROSR 2X · P1 HOST · preparando P2…"',
          )
          s = s.replace(
              '"PCSX-ReARMed · preparando núcleo…"',
              '"PCSX-ReARMed · RETROSR 2X · preparando núcleo…"',
          )
          s = s.replace(
              '"%.2f FPS · %d Hz · PCSX SOFTWARE · MEMCARD ACTIVA"',
              '"%.2f FPS · %d Hz · PCSX · RETROSR 2X · MEMCARD ACTIVA"',
          )
          p.write_text(s)

          # 3) Version bump.
          p = Path("app/build.gradle")
          s = p.read_text()
          if 'versionName "1.0.2-rc1"' in s:
              s = s.replace("versionCode 62", "versionCode 63", 1)
              s = s.replace('versionName "1.0.2-rc1"', 'versionName "1.1.0-rc1"', 1)
          elif ('versionName "1.1.0-rc1"' not in s
                and 'versionName "1.2.0-rc1"' not in s
                and 'versionName "1.3.0-rc1"' not in s
                and 'versionName "1.4.0-rc1"' not in s):
              raise SystemExit("Unexpected RetroLink base version for RetroSR")
          p.write_text(s)

          layout = Path("app/src/main/res/layout/activity_main.xml")
          if layout.is_file():
              s = layout.read_text()
              s = s.replace("v1.0.2 RC1", "v1.1.0 RC1")
              layout.write_text(s)

          print("v1.1.0 RetroSR 2X graphics patch applied")
          PY

