      - name: Static multiplayer validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          transfer = Path("app/src/main/java/cl/retrolink/app/GameBoyRomTransfer.java").read_text()
          room = Path("app/src/main/java/cl/retrolink/app/GameBoyLinkActivity.java").read_text()
          library = Path("app/src/main/java/cl/retrolink/app/GameBoyLibraryActivity.java").read_text()
          game = Path("app/src/main/java/cl/retrolink/app/IntegratedGameActivity.java").read_text()
          controller = Path("app/src/main/java/cl/retrolink/app/ControllerActivity.java").read_text()
          build = Path("app/build.gradle").read_text()

          # P2 no depende de una ROM local.
          assert 'P2 no necesita importar ni seleccionar ROM' in room
          assert 'P2 puede entrar a Multiplayer sin ROM' in library
          assert 'btnGbMultiplayer).setEnabled(true)' in library
          assert 'GameBoyLinkActivity.EXTRA_AUTO_JOIN_IP' in controller
          assert 'Selecciona el mismo juego GB/GBC para entrar como P2' not in controller

          # P1 transfiere la ROM y P2 verifica exactamente el archivo recibido.
          assert 'public static final int PORT = 56399;' in transfer
          assert 'MessageDigest.getInstance("SHA-256")' in transfer
          assert 'out.writeUTF("SEND")' in transfer
          assert '"READY|" + expectedSha' in transfer
          assert '"HAVE|" + expectedSha' in transfer
          assert 'postClientRomReady' in transfer
          assert 'postClientStart' in transfer
          assert 'hostCoreReady.await' in transfer

          # Gambatte P1 debe estar READY antes de autorizar el arranque de P2.
          assert 'EXTRA_GB_LINK_READY_RECEIVER' in game
          assert 'linkReadyReceiver.send(LINK_CORE_READY' in game
          assert 'transfer.signalHostCoreReady()' in room
          assert 'buildGameIntent("Network Server"' in room
          assert 'buildGameIntent("Network Client"' in room
          assert 'private static final int LINK_PORT = 56400;' in room

          # No vuelve a aparecer el launcher manual que causaba sesiones 1P paralelas.
          assert 'launch.setVisibility(View.GONE)' in room

          assert 'versionCode 35' in build
          assert 'versionName "0.7.5-rc1"' in build

          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)
          ET.parse("app/src/main/AndroidManifest.xml")

          # Basic structural sanity for the two new/replaced Java classes.
          for src in (transfer, room):
              assert src.count("{") == src.count("}"), "Unbalanced Java braces"

          print("v0.7.5 REAL Game Boy multiplayer static validation PASS")
          PY

      - name: Commit v0.7.5 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v0.7.5 already committed."
          else
            git commit -m "feat(v0.7.5): transfer P1 Game Boy ROM to P2 and synchronize Game Link"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Build pinned N64 core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          from pathlib import Path
          p=Path("libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Fetch pinned Gambatte
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf gambattecore
          git init gambattecore
          cd gambattecore
          git remote add origin https://github.com/libretro/gambatte-libretro.git
          git fetch --depth 1 origin "${GAMBATTE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GAMBATTE_SHA}"
          test -f libgambatte/libretro/jni/Android.mk
          grep -q 'HAVE_NETWORK := 1' libgambatte/libretro/jni/Android.mk
          grep -q 'net_serial.cpp' Makefile.common

      - name: Build network-enabled Gambatte ARM64
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("gambattecore/libgambatte/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE    := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE    := retro_gambatte",1))
          PY
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd gambattecore/libgambatte/libretro/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a
          test -s libs/arm64-v8a/libretro_gambatte.so
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'gambatte_gb_link_mode'
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'Network Server'
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'Network Client'
          strings libs/arm64-v8a/libretro_gambatte.so | grep -F 'GameLink network server started'

      - name: Install Gambatte core
        shell: bash
        run: |
          set -euxo pipefail
          cp gambattecore/libgambatte/libretro/jni/libs/arm64-v8a/libretro_gambatte.so \
             app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          grep -q 'versionName "0.7.5-rc1"' app/build.gradle
          grep -q 'GameBoyRomTransfer.PORT' app/src/main/java/cl/retrolink/app/GameBoyLinkActivity.java
          grep -q 'LINK_CORE_READY' app/src/main/java/cl/retrolink/app/IntegratedGameActivity.java

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.7.5-real-gameboy-multiplayer-rc1-debug.apk
          sha256sum RetroLink-v0.7.5-real-gameboy-multiplayer-rc1-debug.apk \
            | tee RetroLink-v0.7.5-real-gameboy-multiplayer-rc1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.7.5-real-gameboy-multiplayer-rc1
          path: |
            RetroLink-v0.7.5-real-gameboy-multiplayer-rc1-debug.apk
            RetroLink-v0.7.5-real-gameboy-multiplayer-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14
