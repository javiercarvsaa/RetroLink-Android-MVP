# RetroLink UI-only increment. Exact source baseline; no stable branch rewrite.
name: RetroLink v1.6.0 Library Hub RC1
'on':
  workflow_dispatch: null
  push:
    branches:
    - main
    paths:
    - .github/workflows/build-retrolink-v1.6.0-library-hub.yml
permissions:
  contents: write
concurrency:
  group: retrolink-v160-library-hub
  cancel-in-progress: false
env:
  BRANCH_NAME: codex/v1.6-library-hub
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 28.2.13676358
  N64_CORE_SHA: 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5
  GAMBATTE_SHA: d9d6cd06382d1ced30de34d56d3609452323dab1
