name: RetroLink v0.9.0 Atari 2600 Foundation

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-retrolink-v0.9.0-atari2600-foundation.yml"

permissions:
  contents: write

env:
  BRANCH_NAME: codex/v0.6-ui-controls
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 28.2.13676358
  N64_CORE_SHA: 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5
  GAMBATTE_SHA: d9d6cd06382d1ced30de34d56d3609452323dab1
  SNES9X_SHA: fae2fea08f74180759ef540ee94259213f503480
  STELLA_SHA: 7d1361e407e63f29e52892655069e5fb4096e691

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Switch to development branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin "${BRANCH_NAME}"
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          grep -Eq 'versionName "0\.(8\.0|9\.0)-rc1"' app/build.gradle

      - name: Apply v0.9.0 Atari 2600 source
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionName "0.9.0-rc1"' app/build.gradle \
             && test -f app/src/main/java/cl/retrolink/app/Atari2600LibraryActivity.java; then
