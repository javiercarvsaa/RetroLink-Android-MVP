      - name: Static functional UI validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import glob, re, xml.etree.ElementTree as ET
          for f in glob.glob('app/src/main/res/**/*.xml', recursive=True) + ['app/src/main/AndroidManifest.xml']:
              ET.parse(f)
          declared=set()
          for f in glob.glob('app/src/main/res/**/*.xml', recursive=True):
              declared.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', open(f, encoding='utf-8').read()))
          refs=set()
          for f in glob.glob('app/src/main/java/**/*.java', recursive=True):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', open(f, encoding='utf-8').read()))
          missing=sorted(refs-declared)
          assert not missing, 'Missing R.id: ' + ', '.join(missing)
          print('XML PASS · R.id PASS ·', len(declared), 'ids')
          PY
          grep -q 'List<ImportedRom> listRoms' app/src/main/java/cl/retrolink/app/N64RomRepository.java
          grep -q 'romGrid' app/src/main/res/layout/activity_library.xml
          grep -q 'btnHostTestControls' app/src/main/res/layout/activity_host.xml
          ! grep -R -q 'RL7K3\|32 juegos encontrados\|42 °C\|2–8 ms' app/src/main/res/layout app/src/main/java

      - name: Commit v0.6.3 menu functional
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md TEST_CHECKLIST.md docs
          if git diff --cached --quiet; then
            echo "v0.6.3 source already present."
          else
            git commit -m "feat(v0.6.3): functional dashboard and real N64 library"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Update or open draft pull request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh pr view "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh pr edit "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" --title "RetroLink v0.6.3 — Functional dashboard & N64 library" || true
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH_NAME}" --draft \
              --title "RetroLink v0.6.3 — Functional dashboard & N64 library" \
              --body "Rediseño de Inicio/Biblioteca/Sala/Perfil según la UI aprobada, manteniendo solo funciones reales. Añade biblioteca N64 multi-ROM local. Validación física pendiente."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re
          p='n64core/libretro/jni/Android.mk'
          s=open(p, encoding='utf-8').read()
          s2, n = re.subn(r'(?m)^(LOCAL_MODULE\s*:=\s*)retro\s*$', r'\1retro_n64', s, count=1)
          if n != 1:
              raise SystemExit('No se encontró exactamente un LOCAL_MODULE retro para renombrar')
          open(p,'w',encoding='utf-8').write(s2)
          PY
          grep -Eq '^[[:space:]]*LOCAL_MODULE[[:space:]]*:=[[:space:]]*retro_n64[[:space:]]*$' n64core/libretro/jni/Android.mk

      - name: Build integrated N64 core for ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          cd n64core/libretro/jni
          "${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}/ndk-build" -j2 NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=arm64-v8a GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build RetroLink v0.6.3 RC1 APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          grep -q 'versionName "0.6.3-rc1"' app/build.gradle
          grep -q 'ControlLayoutActivity' app/src/main/AndroidManifest.xml
          grep -q 'romGrid' app/src/main/res/layout/activity_library.xml

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.6.3-menu-functional-rc1-debug.apk
          sha256sum RetroLink-v0.6.3-menu-functional-rc1-debug.apk | tee RetroLink-v0.6.3-menu-functional-rc1-debug.sha256

      - name: Upload RetroLink v0.6.3 Menu Functional RC1
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.6.3-menu-functional-rc1
          path: |
            RetroLink-v0.6.3-menu-functional-rc1-debug.apk
            RetroLink-v0.6.3-menu-functional-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RetroLink v0.6.3 RC1"
            echo ""
            echo "- Dashboard visual funcional"
            echo "- Biblioteca N64 multi-ROM real"
            echo "- Sala reorganizada con estados reales"
            echo "- Perfil con datos reales"
            echo "- Ajustes solo funcionales"
            echo "- Manual validation pending: UI en teléfono, biblioteca, Smash Bros, DK64, Mario Kart y cierre"
          } >> "$GITHUB_STEP_SUMMARY"
