name: Bootstrap RetroLink v0.6.0 RC1

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-retrolink-v0.6.0-bootstrap.yml"

permissions:
  contents: write
  pull-requests: write

