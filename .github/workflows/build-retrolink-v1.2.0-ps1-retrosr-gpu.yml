        shell: bash
        run: |
          set -euxo pipefail
          cp stellacore/jni/libs/arm64-v8a/libretro_atari2600.so \
             app/src/main/jniLibs/arm64-v8a/libretro_atari2600.so

      - name: Fetch pinned PCSX-ReARMed
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf pcsxcore
          git init pcsxcore
          cd pcsxcore
          git remote add origin https://github.com/libretro/pcsx_rearmed.git
          git fetch --depth 1 origin "${PCSX_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${PCSX_SHA}"
          test -f jni/Android.mk
          test -f jni/Application.mk
          grep -F 'info->library_name     = "PCSX-ReARMed"' frontend/libretro.c
          grep -F 'info->need_fullpath    = true' frontend/libretro.c
          grep -F 'bin|cue|img|mdf|pbp|toc|cbn|m3u|chd|iso|exe' frontend/libretro.c

      - name: Build PCSX-ReARMed ARM64
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("pcsxcore/jni/Android.mk")
          s=p.read_text()
          s2,n=re.subn(r'LOCAL_MODULE\s*:=\s*retro\b',
                       'LOCAL_MODULE        := retro_ps1', s, count=1)
          assert n == 1
          p.write_text(s2)
          PY

          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd pcsxcore/jni
          "${NDK_ROOT}/ndk-build" -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a

          test -s libs/arm64-v8a/libretro_ps1.so
          strings libs/arm64-v8a/libretro_ps1.so > "$RUNNER_TEMP/pcsx.strings"
          grep -qi 'PCSX-ReARMed' "$RUNNER_TEMP/pcsx.strings"
          grep -q 'pcsx_rearmed_neon_enhancement_enable' "$RUNNER_TEMP/pcsx.strings"

      - name: Install PCSX-ReARMed core
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp pcsxcore/jni/libs/arm64-v8a/libretro_ps1.so \
             app/src/main/jniLibs/arm64-v8a/libretro_ps1.so
          test -s app/src/main/jniLibs/arm64-v8a/libretro_ps1.so

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_snes9x.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_atari2600.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_ps1.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          grep -q 'versionName "1.2.0-rc1"' app/build.gradle
          grep -q 'setSessionType("PS1")' app/src/main/java/cl/retrolink/app/Ps1RoomActivity.java
          grep -q 'configurePs1Defaults' app/src/main/java/cl/retrolink/app/Ps1GameActivity.java
          grep -q 'Ps1GpuCoreView' app/src/main/java/cl/retrolink/app/Ps1GameActivity.java
          grep -q 'RETROSR_GSR_FRAGMENT' app/src/main/java/cl/retrolink/app/Ps1GpuCoreView.java
          grep -q 'Ps1GpuCoreView' app/src/main/res/layout/activity_ps1_game.xml
          grep -q 'BSD-3-Clause' app/src/main/assets/NOTICE_RETROSR_SGSR.txt
          grep -q 'info.need_fullpath' app/src/main/cpp/retrolink_native.cpp

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk \
             RetroLink-v1.2.0-ps1-retrosr-gpu-rc1-debug.apk
          sha256sum RetroLink-v1.2.0-ps1-retrosr-gpu-rc1-debug.apk \
            | tee RetroLink-v1.2.0-ps1-retrosr-gpu-rc1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v1.2.0-ps1-retrosr-gpu-rc1
          path: |
            RetroLink-v1.2.0-ps1-retrosr-gpu-rc1-debug.apk
            RetroLink-v1.2.0-ps1-retrosr-gpu-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14
