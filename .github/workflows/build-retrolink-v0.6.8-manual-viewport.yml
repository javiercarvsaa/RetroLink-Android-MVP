name: RetroLink v0.6.8 Manual Player Viewport

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-retrolink-v0.6.8-manual-viewport.yml"

permissions:
  contents: write
  pull-requests: write

env:
  BRANCH_NAME: codex/v0.6-ui-controls
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 28.2.13676358
  N64_CORE_SHA: 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5

jobs:
  manual-viewport-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Switch to v0.6 development branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin "${BRANCH_NAME}"
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          grep -Eq 'versionName "0\.6\.(7|8)-rc1"' app/build.gradle

      - name: Apply v0.6.8 manual viewport patch
        shell: bash
        run: |
          set -euxo pipefail
          if grep -q 'versionName "0.6.8-rc1"' app/build.gradle; then
            echo "v0.6.8 source already present."
            exit 0
          fi
