      - name: Build RetroLink v0.2
        working-directory: retrolink
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          cp retrolink/app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.2-distributed-display.apk
          ls -lh RetroLink-v0.2-distributed-display.apk

      - name: Upload RetroLink v0.2 APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.2-distributed-display
          path: RetroLink-v0.2-distributed-display.apk
          if-no-files-found: error
          retention-days: 14
