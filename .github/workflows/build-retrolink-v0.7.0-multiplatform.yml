      - name: Static MultiPlatform validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET

          for p in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('app/src/main/AndroidManifest.xml')

          registry=Path('app/src/main/java/cl/retrolink/app/CoreRegistry.java').read_text()
          native=Path('app/src/main/cpp/retrolink_native.cpp').read_text()
          surface=Path('app/src/main/java/cl/retrolink/app/EmulatorSurfaceView.java').read_text()
          library=Path('app/src/main/java/cl/retrolink/app/GameBoyLibraryActivity.java').read_text()
          manifest=Path('app/src/main/AndroidManifest.xml').read_text()
          build=Path('app/build.gradle').read_text()

          for token in ['GAME_BOY','libretro_gambatte.so','gb.gambatte']:
              assert token in registry, token
          for token in ['render_software_frame','g_core_is_n64','nativeSetOutputSize','RETRO_HW_FRAME_BUFFER_VALID']:
              assert token in native, token
          assert 'configure(CoreRegistry.Core core' in surface
          assert 'GameBoyRomRepository' in library
          assert 'IntegratedGameActivity' in manifest
          assert 'GameBoyLibraryActivity' in manifest
          assert 'versionCode 30' in build
          assert 'versionName "0.7.0-rc1"' in build

          ids=set()
          for p in Path('app/src/main/res').rglob('*.xml'):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          refs=set()
          for p in Path('app/src/main/java').rglob('*.java'):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          missing=sorted(refs-ids)
          assert not missing, f'Missing R.id: {missing}'
          print('v0.7.0 MultiPlatform static validation PASS')
          PY

      - name: Commit v0.7.0 source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v0.7.0 source already present."
          else
            git commit -m "feat(v0.7.0): add multiplatform foundation and Game Boy core"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro/jni/Application.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('n64core/libretro/jni/Android.mk')
          s=p.read_text()
          old='LOCAL_MODULE           := retro'
          assert old in s
          p.write_text(s.replace(old,'LOCAL_MODULE           := retro_n64',1))
          PY

      - name: Build integrated N64 core ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build" \
            -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Install Gambatte Game Boy core ARM64
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/gambatte"
          mkdir -p "$RUNNER_TEMP/gambatte"
          curl -fL --retry 4 --retry-delay 3 "$GAMBATTE_URL" -o "$RUNNER_TEMP/gambatte.zip"
          sha256sum "$RUNNER_TEMP/gambatte.zip" | tee "$RUNNER_TEMP/gambatte-download.sha256"
          unzip -q "$RUNNER_TEMP/gambatte.zip" -d "$RUNNER_TEMP/gambatte"
          CORE="$(find "$RUNNER_TEMP/gambatte" -type f -name '*gambatte*.so' | head -n1)"
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so
          test -s app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so
          file app/src/main/jniLibs/arm64-v8a/libretro_gambatte.so

      - name: Build RetroLink v0.7.0 RC1 APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate MultiPlatform APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_gambatte.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          grep -q 'versionName "0.7.0-rc1"' app/build.gradle
          grep -q 'render_software_frame' app/src/main/cpp/retrolink_native.cpp
          grep -q 'GameBoyLibraryActivity' app/src/main/AndroidManifest.xml

      - name: Prepare APK and checksums
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.7.0-multiplatform-rc1-debug.apk
          sha256sum RetroLink-v0.7.0-multiplatform-rc1-debug.apk | tee RetroLink-v0.7.0-multiplatform-rc1-debug.sha256
          cp "$RUNNER_TEMP/gambatte-download.sha256" Gambatte-buildbot-download.sha256

      - name: Upload RetroLink v0.7.0 MultiPlatform RC1
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.7.0-multiplatform-rc1
          path: |
            RetroLink-v0.7.0-multiplatform-rc1-debug.apk
            RetroLink-v0.7.0-multiplatform-rc1-debug.sha256
            Gambatte-buildbot-download.sha256
          if-no-files-found: error
          retention-days: 14
