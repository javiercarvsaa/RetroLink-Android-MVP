      - name: Static manual viewport validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for p in Path('app/src/main/res').rglob('*.xml'):
              ET.parse(p)
          ET.parse('app/src/main/AndroidManifest.xml')
          ids=set()
          for p in Path('app/src/main/res').rglob('*.xml'):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          refs=set()
          for p in Path('app/src/main/java').rglob('*.java'):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(errors='ignore')))
          missing=sorted(refs-ids)
          assert not missing, f'Missing R.id: {missing}'
          prefs=Path('app/src/main/java/cl/retrolink/app/PlayerViewportPreferences.java').read_text()
          remote=Path('app/src/main/java/cl/retrolink/app/RemoteFrameView.java').read_text()
          ctrl=Path('app/src/main/java/cl/retrolink/app/ControllerActivity.java').read_text()
          host=Path('app/src/main/java/cl/retrolink/app/IntegratedN64Activity.java').read_text()
          settings=Path('app/src/main/java/cl/retrolink/app/SettingsActivity.java').read_text()
          build=Path('app/build.gradle').read_text()
          for token in ['offsetX','offsetY','zoom','resetAll','remote_p','local_p']:
              assert token in prefs, token
          for token in ['nudgeViewport','changeViewportZoom','manualViewportRect','viewportLabel']:
              assert token in remote, token
          for token in ['btnControllerViewport','btnControllerViewUp','btnControllerViewDown','btnControllerViewReset']:
              assert token in ctrl, token
          for token in ['btnEmuViewportAdjust','btnEmuViewUp','btnEmuViewDown','PlayerViewportPreferences']:
              assert token in host, token
          assert 'PlayerViewportPreferences.resetAll(this)' in settings
          assert 'versionCode 23' in build
          assert 'versionName "0.6.8-rc1"' in build
          print('v0.6.8 manual viewport static checks PASS')
          PY2

      - name: Commit v0.6.8 manual viewport
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app README.md TEST_CHECKLIST.md docs .github/workflows/build-retrolink.yml
          if git diff --cached --quiet; then
            echo "v0.6.8 source already present."
          else
            git commit -m "feat(v0.6.8): add manual per-player viewport adjustment"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Update or open draft pull request
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          if gh pr view "${BRANCH_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Draft PR already exists."
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base main --head "${BRANCH_NAME}" --draft \
              --title "RetroLink v0.6.8 — Manual Player Viewport" \
              --body "Ajuste manual persistente de encuadre por jugador P1-P4: desplazamiento X/Y, zoom y centrado. Cierra la serie v0.6 antes de MultiPlatform Foundation v0.7.0."
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK, NDK and CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next core
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro-common/include/libretro.h

      - name: Give N64 core a stable Android library name
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('n64core/libretro/jni/Android.mk')
          s = p.read_text()
          old = 'LOCAL_MODULE           := retro'
          assert old in s, 'LOCAL_MODULE retro not found'
          p.write_text(s.replace(old, 'LOCAL_MODULE           := retro_n64', 1))
          PY2

      - name: Build integrated N64 core for ARM64 GLES3
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build" \
            -j2 \
            NDK_PROJECT_PATH=. \
            NDK_APPLICATION_MK=Application.mk \
            APP_BUILD_SCRIPT=Android.mk \
            APP_ABI=arm64-v8a \
            GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and libretro ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build RetroLink v0.6.8 RC1 APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK contents
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          grep -q 'versionName "0.6.8-rc1"' app/build.gradle
          grep -q 'PlayerViewportPreferences' app/src/main/java/cl/retrolink/app/PlayerViewportPreferences.java
          grep -q 'btnControllerViewport' app/src/main/res/layout/activity_controller.xml
          grep -q 'btnEmuViewportAdjust' app/src/main/res/layout/activity_integrated_n64.xml

      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.6.8-manual-viewport-rc1-debug.apk
          sha256sum RetroLink-v0.6.8-manual-viewport-rc1-debug.apk | tee RetroLink-v0.6.8-manual-viewport-rc1-debug.sha256

      - name: Upload RetroLink v0.6.8 Manual Viewport RC1
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.6.8-manual-viewport-rc1
          path: |
            RetroLink-v0.6.8-manual-viewport-rc1-debug.apk
            RetroLink-v0.6.8-manual-viewport-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RetroLink v0.6.8 RC1 — Manual Player Viewport"
            echo ""
            echo "- P1-P4: ajuste manual X/Y + zoom + CENTRO"
            echo "- Persistencia separada Host/P1 y remote P2-P4"
            echo "- Ajuste manual encima de Remote Centering v0.6.7"
            echo "- Próximo objetivo: v0.7.0 MultiPlatform Foundation"
          } >> "$GITHUB_STEP_SUMMARY"
