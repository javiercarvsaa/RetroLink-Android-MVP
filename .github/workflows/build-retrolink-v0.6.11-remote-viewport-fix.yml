name: RetroLink v0.6.11 Remote Viewport Functional Fix

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/build-retrolink-v0.6.11-remote-viewport-fix.yml"

permissions:
  contents: write

env:
  BRANCH_NAME: codex/v0.6-ui-controls
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk
  NDK_VERSION: 28.2.13676358
  N64_CORE_SHA: 12edd2c74a517ff86dfa8cfc71ad75e4c10486d5

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Switch to development branch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin "${BRANCH_NAME}"
          git switch -C "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          grep -Eq 'versionName "0\.6\.(10|11)-rc1"' app/build.gradle

      - name: Apply v0.6.11 remote viewport fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          remote = Path("app/src/main/java/cl/retrolink/app/RemoteFrameView.java")
          client = Path("app/src/main/java/cl/retrolink/app/net/FrameStreamClient.java")
          build = Path("app/build.gradle")

          rs = remote.read_text()
          old = '    private Rect sourceFor(Bitmap bitmap, boolean cropped) {\n        if (bitmap == null || bitmap.isRecycled()) return new Rect(0, 0, 1, 1);\n        if (cropped && playerView) {\n            // v0.6.7 Remote Centering: el Host ya intenta retirar letterbox antes\n            // del JPEG, pero la compresión puede convertir negro puro en near-black\n            // y dejar una banda que v0.6.6 no lograba eliminar. Hacemos una segunda\n            // medición sobre el frame decodificado y usamos solo el contenido visible.\n            return manualViewportRect(trimDecodedBlackBands(bitmap));\n        }\n        if (cropped || !playerView) return new Rect(0,0,bitmap.getWidth(),bitmap.getHeight());\n        return SplitScreenProfile.sourceRect(bitmap.getWidth(), bitmap.getHeight(), playerCount, player);\n    }\n'
          new = '    private Rect sourceFor(Bitmap bitmap, boolean cropped) {\n        if (bitmap == null || bitmap.isRecycled()) return new Rect(0, 0, 1, 1);\n\n        // v0.6.11: el ajuste manual debe funcionar tanto cuando el Host entrega\n        // PLAYER HQ pre-recortado como cuando temporalmente sigue entregando FULL.\n        // Antes, X/Y/Zoom solo se aplicaban en preCropped=true: los valores de P2\n        // cambiaban en pantalla, pero el bitmap FULL ignoraba manualViewportRect().\n        if (!playerView) return new Rect(0, 0, bitmap.getWidth(), bitmap.getHeight());\n\n        Rect base;\n        if (cropped) {\n            // El Host ya enfocó al jugador; retiramos letterbox residual post-JPEG.\n            base = trimDecodedBlackBands(bitmap);\n        } else {\n            // Fallback autónomo del teléfono remoto. Selecciona su viewport desde\n            // el frame FULL y luego aplica exactamente el mismo X/Y/Zoom manual.\n            base = SplitScreenProfile.sourceRect(\n                    bitmap.getWidth(), bitmap.getHeight(), playerCount, player);\n        }\n        return manualViewportRect(base);\n    }\n'
          if old in rs:
              rs = rs.replace(old, new, 1)
              remote.write_text(rs)
          elif "return manualViewportRect(base);" not in rs:
              raise SystemExit("RemoteFrameView baseline inesperado")

          cs = client.read_text()
          old2 = '        status("Video LL · " + fps + " FPS · P" + player + (preCropped ? " PLAYER HQ" : " FULL")\n                + (dk64Raw ? " · DK64 RAW" : " · RetroSR 2.2"));\n'
          new2 = '        // Si el Host todavía responde FULL mientras el usuario ya eligió PLAYER,\n        // reenviamos el comando y mantenemos un fallback local funcional.\n        if (playerView && !preCropped) setPlayerView(true);\n        String viewMode = preCropped ? " PLAYER HQ" : (playerView ? " PLAYER LOCAL" : " FULL");\n        status("Video LL · " + fps + " FPS · P" + player + viewMode\n                + (dk64Raw ? " · DK64 RAW" : " · RetroSR 2.2"));\n'
          if old2 in cs:
              cs = cs.replace(old2, new2, 1)
              client.write_text(cs)
          elif 'PLAYER LOCAL' not in cs:
              raise SystemExit("FrameStreamClient baseline inesperado")

          bs = build.read_text()
          if 'versionName "0.6.10-rc1"' in bs:
              bs = bs.replace("versionCode 25", "versionCode 26", 1)
              bs = bs.replace('versionName "0.6.10-rc1"', 'versionName "0.6.11-rc1"', 1)
              build.write_text(bs)
          PY

      - name: Static functional validation
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET

          for p in Path("app/src/main/res").rglob("*.xml"):
              ET.parse(p)
          ET.parse("app/src/main/AndroidManifest.xml")

          remote = Path("app/src/main/java/cl/retrolink/app/RemoteFrameView.java").read_text()
          client = Path("app/src/main/java/cl/retrolink/app/net/FrameStreamClient.java").read_text()
          controller = Path("app/src/main/java/cl/retrolink/app/ControllerActivity.java").read_text()
          build = Path("app/build.gradle").read_text()

          assert "if (!playerView) return new Rect" in remote
          assert "SplitScreenProfile.sourceRect(" in remote
          assert "return manualViewportRect(base);" in remote
          assert "wantedDx" in remote and "wantedDy" in remote
          assert 'PLAYER LOCAL' in client
          assert "if (playerView && !preCropped) setPlayerView(true);" in client
          assert "screen.nudgeViewport" in controller
          assert "screen.changeViewportZoom" in controller
          assert 'versionCode 26' in build
          assert 'versionName "0.6.11-rc1"' in build

          ids=set()
          for p in Path("app/src/main/res").rglob("*.xml"):
              ids.update(re.findall(r'@\+id/([A-Za-z0-9_]+)', p.read_text(errors="ignore")))
          refs=set()
          for p in Path("app/src/main/java").rglob("*.java"):
              refs.update(re.findall(r'R\.id\.([A-Za-z0-9_]+)', p.read_text(errors="ignore")))
          missing=sorted(refs-ids)
          assert not missing, f"Missing R.id: {missing}"
          print("v0.6.11 Remote Viewport functional validation PASS")
          PY

      - name: Commit source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "v0.6.11 already present."
          else
            git commit -m "fix(v0.6.11): make remote player viewport controls functional"
            git push origin "${BRANCH_NAME}"
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Install Android SDK NDK CMake
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"             "ndk;${NDK_VERSION}"             "cmake;3.22.1"

      - name: Fetch pinned Mupen64Plus-Next
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf n64core
          git init n64core
          cd n64core
          git remote add origin https://github.com/libretro/mupen64plus-libretro-nx.git
          git fetch --depth 1 origin "${N64_CORE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${N64_CORE_SHA}"
          test -f libretro/jni/Android.mk
          test -f libretro/jni/Application.mk
          test -f libretro-common/include/libretro.h

      - name: Rename N64 Android module
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("n64core/libretro/jni/Android.mk")
          s=p.read_text()
          old="LOCAL_MODULE           := retro"
          assert old in s
          p.write_text(s.replace(old,"LOCAL_MODULE           := retro_n64",1))
          PY

      - name: Build integrated N64 core
        shell: bash
        run: |
          set -euxo pipefail
          export NDK_ROOT="${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}"
          cd n64core/libretro/jni
          "${NDK_ROOT}/ndk-build"             -j2             NDK_PROJECT_PATH=.             NDK_APPLICATION_MK=Application.mk             APP_BUILD_SCRIPT=Android.mk             APP_ABI=arm64-v8a             GLES3=1
          test -f libs/arm64-v8a/libretro_n64.so

      - name: Install N64 core and ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/cpp
          cp n64core/libretro/jni/libs/arm64-v8a/libretro_n64.so app/src/main/jniLibs/arm64-v8a/libretro_n64.so
          cp n64core/libretro-common/include/libretro.h app/src/main/cpp/libretro.h

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Validate APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretro_n64.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libretrolink_native.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          grep -q 'versionName "0.6.11-rc1"' app/build.gradle
          grep -q 'PLAYER LOCAL' app/src/main/java/cl/retrolink/app/net/FrameStreamClient.java
          grep -q 'return manualViewportRect(base);' app/src/main/java/cl/retrolink/app/RemoteFrameView.java

      - name: Prepare APK
        shell: bash
        run: |
          set -euxo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk RetroLink-v0.6.11-remote-viewport-fix-rc1-debug.apk
          sha256sum RetroLink-v0.6.11-remote-viewport-fix-rc1-debug.apk             | tee RetroLink-v0.6.11-remote-viewport-fix-rc1-debug.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RetroLink-v0.6.11-remote-viewport-fix-rc1
          path: |
            RetroLink-v0.6.11-remote-viewport-fix-rc1-debug.apk
            RetroLink-v0.6.11-remote-viewport-fix-rc1-debug.sha256
          if-no-files-found: error
          retention-days: 14
